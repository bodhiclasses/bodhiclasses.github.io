e-height:0}\n.wm-stack canvas{display:block;max-width:100%;height:auto;border-radius:4px}\n.wm-stack canvas.ovl{position:absolute;inset:0;width:100%;height:100%}\n.wm-dim{opacity:.35;pointer-events:none;filter:saturate(.4)}\n#wm-dt-res b.dtok{color:#8fe3ae}#wm-dt-res b.dtbad{color:#ff9d9d}\n@media (max-width:920px){\n  #view-wm .wm-layout>div:first-child{position:sticky;top:62px;z-index:40;background:rgba(9,17,40,.95);backdrop-filter:blur(8px);border-radius:14px;padding:4px 4px 2px}\n  #view-wm .pgnav{margin:6px 0 4px}\n}\n.pgnav{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;font-size:.8rem;color:var(--muted)}\n.posgrid{display:grid;grid-template-columns:repeat(3,34px);gap:5px}\n.posgrid button{width:34px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.16);background:transparent;cursor:pointer;transition:.15s;position:relative}\n.posgrid button::after{content:\"\";position:absolute;inset:0;margin:auto;width:8px;height:8px;border-radius:3px;background:var(--muted)}\n.posgrid button.on{border-color:var(--gold);background:var(--gold-soft)}\n.posgrid button.on::after{background:var(--gold)}\n.slider-line{display:grid;grid-template-columns:86px 1fr 44px;align-items:center;gap:8px;font-size:.78rem;color:var(--muted)}\n.slider-line output{color:var(--gold);font-weight:700;text-align:right;font-size:.76rem}\n.slider-line + .slider-line{margin-top:9px}\n\n/* ---------- image tool cards ---------- */\n.imglist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:14px}\n.icard{background:var(--navy-800);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px;animation:vin .3s ease both}\n.icard .ith{width:100%;height:120px;border-radius:8px;background:#0A1735;display:flex;align-items:center;justify-content:center;overflow:hidden}\n.icard .ith img{max-width:100%;max-height:100%;object-fit:contain}\n.icard .iname{font-size:.76rem;font-weight:700;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.icard .imeta{font-size:.68rem;color:var(--muted);margin-top:2px}\n.icard .iresult{font-size:.7rem;margin-top:5px;color:var(--ok);font-weight:700}\n.icard .iresult.bad{color:var(--bad)}\n.preset{background:var(--navy-700);border:1px solid var(--line);color:var(--gold);font-size:.72rem;font-weight:700;padding:4px 11px;border-radius:999px;cursor:pointer;transition:.15s;font-family:inherit}\n.preset:hover{background:var(--gold);color:var(--navy-950)}\n\n/* ---------- scanner ---------- */\n.sc-stage{position:relative;background:#0A1735;border:1px solid rgba(255,255,255,.1);border-radius:var(--r);padding:12px;display:flex;justify-content:center;min-height:200px}\n.sc-wrap{position:relative;line-height:0;touch-action:none}\n.sc-wrap canvas{max-width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 14px 40px rgba(0,0,0,.4)}\n.cropbox{position:absolute;border:1.6px dashed var(--gold);background:rgba(216,178,74,.12);display:none;pointer-events:none;border-radius:2px}\n.filterchips{display:flex;flex-wrap:wrap;gap:7px}\n.fchip{background:transparent;border:1px solid rgba(255,255,255,.16);color:var(--muted);padding:6px 14px;border-radius:999px;font-size:.78rem;cursor:pointer;font-family:inherit;font-weight:600;transition:.15s}\n.fchip.on{background:var(--gold);color:var(--navy-950);border-color:var(--gold);font-weight:700}\n.sc-pages{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}\n.sc-pg{width:74px;position:relative}\n.sc-pg img{width:100%;border-radius:7px;border:1px solid rgba(255,255,255,.14);display:block}\n.sc-pg .x{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--bad);color:#20090b;border:none;font-weight:800;font-size:.7rem;cursor:pointer;line-height:1}\n.sc-pg .n{position:absolute;left:4px;bottom:4px;background:rgba(7,14,34,.85);color:var(--gold);font-size:.6rem;font-weight:700;padding:0 6px;border-radius:999px}\n\n/* ---------- results / progress / toast ---------- */\n.resultbox{margin-top:14px;background:linear-gradient(135deg,rgba(123,208,154,.1),rgba(216,178,74,.07));border:1px solid rgba(123,208,154,.35);border-radius:var(--r);padding:16px;display:none}\n.resultbox.show{display:block;animation:vin .3s ease both}\n.resultbox h4{color:var(--ok);font-size:.9rem;margin-bottom:8px}\n.resultbox .stat{font-size:.8rem;color:var(--ink);margin-bottom:10px}\n.resultbox .stat b{color:var(--gold)}\n.dlrow{display:flex;flex-wrap:wrap;gap:8px}\n#busy{position:fixed;inset:0;background:rgba(7,14,34,.82);backdrop-filter:blur(8px);z-index:100;display:none;align-items:center;justify-content:center}\n#busy.show{display:flex}\n.busybox{background:var(--navy-800);border:1px solid var(--line);border-radius:20px;padding:30px 36px;text-align:center;min-width:270px;box-shadow:0 30px 90px rgba(0,0,0,.6)}\n.flame{width:52px;height:52px;margin:0 auto 14px;border-radius:50%;background:conic-gradient(from 0deg,var(--gold),#fff3c4,var(--gold-deep),var(--gold));animation:spin 1.1s linear infinite;position:relative}\n.flame::after{content:\"\";position:absolute;inset:6px;background:var(--navy-800);border-radius:50%}\n@keyframes spin{to{transform:rotate(360deg)}}\n#busy-text{font-size:.88rem;font-weight:700;color:var(--ink)}\n#busy-sub{font-size:.72rem;color:var(--muted);margin-top:3px;min-height:1em}\n.pbar{height:6px;background:rgba(255,255,255,.1);border-radius:99px;margin-top:14px;overflow:hidden}\n.pbar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--gold),#ffe9a8);border-radius:99px;transition:width .25s}\n#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:var(--navy-800);border:1px solid var(--line);color:var(--ink);padding:11px 20px;border-radius:14px;font-size:.84rem;z-index:120;opacity:0;pointer-events:none;transition:.3s;max-width:88vw;text-align:center;box-shadow:0 16px 44px rgba(0,0,0,.5)}\n#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}\n#toast.err{border-color:rgba(240,138,138,.55)}\n#toast.ok{border-color:rgba(123,208,154,.55)}\n\nfooter{border-top:1px solid rgba(216,178,74,.14);margin-top:40px;padding:22px 18px;text-align:center;color:var(--muted);font-size:.74rem;position:relative;z-index:1}\nfooter a{color:var(--gold);text-decoration:none}\nfooter .priv{color:var(--ink);font-weight:600;margin-bottom:4px;font-size:.78rem}\n.hidden{display:none !important}\n/* ---- वॉटरमार्क के भीतर पेज संपादन ---- */\n#wm-edit .toolbar{position:static;top:auto}\n#wm-ed-srcs{display:flex;flex-wrap:wrap;gap:8px}\n#wm-ed-srcs .chip{display:inline-flex;align-items:center;gap:7px;font-size:.74rem}\n#wm-ed-srcs .chip .pico{width:20px;height:20px;font-size:.68rem}\n#wm-ed-srcs .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid rgba(255,255,255,.65);display:inline-block;flex:0 0 auto}\n#wm-ed-grid{max-height:58vh;overflow:auto;padding:2px}\n#wm-edit .edhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}\n#wm-edit.folded #wm-ed-box{display:none}\n#wm-ed-dirty{color:var(--gold);font-weight:700}\n\n@media (max-width:560px){\n  .tool-grid{grid-template-columns:repeat(2,1fr)}\n  .toolbar{top:58px}\n  :root{--thw:104px}\n}\n<\/style>\n<\/head>\n<body>\n<div class=\"orb a\"><\/div><div class=\"orb b\"><\/div>\n<header>\n  <div class=\"hwrap\">\n    <svg class=\"diya\" viewBox=\"0 0 32 32\" aria-hidden=\"true\"><path d=\"M16 4c2.6 3 2.6 5.6 0 7.6-2.6-2-2.6-4.6 0-7.6z\" fill=\"#D8B24A\"/><path d=\"M5 17c0 5.2 5 9 11 9s11-3.8 11-9H5z\" fill=\"none\" stroke=\"#D8B24A\" stroke-width=\"1.7\"/><path d=\"M9 17c1.5-2.6 4-4 7-4s5.5 1.4 7 4\" fill=\"none\" stroke=\"#D8B24A\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><\/svg>\n    <div class=\"brand\">बोधि स्टूडियो<small>PDF + IMAGE TOOLKIT v9.2 · ब्राउज़र के अंदर<\/small><\/div>\n    <button class=\"backbtn\" id=\"backbtn\">← होम<\/button>\n  <\/div>\n  <div class=\"seam\"><\/div>\n<\/header>\n<main>\n\n<!-- ================= HOME ================= -->\n<section class=\"view active\" id=\"view-home\">\n  <div class=\"hero\">\n    <h1>दस्तावेज़ का पूरा <em>कारख़ाना<\/em>,<br>एक ही पन्ने पर<\/h1>\n    <p>PDF जोड़ो-तोड़ो, वॉटरमार्क गाड़ो, फोटो को फ़ॉर्म-लायक KB में उतारो, काग़ज़ स्कैन करो — सब कुछ यहीं।<\/p>\n    <div class=\"chips\">\n      <span class=\"chip\"><b>100%<\/b> ब्राउज़र में — कोई फ़ाइल अपलोड नहीं होती<\/span>\n      <span class=\"chip\"><b>10<\/b> टूल<\/span>\n      <span class=\"chip\">मोबाइल + डेस्कटॉप<\/span>\n    <\/div>\n  <\/div>\n  <div class=\"tool-grid\">\n    <div class=\"tcard\" data-view=\"view-studio\"><span class=\"tag\">मुख्य<\/span><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"3\" width=\"7.5\" height=\"9.5\" rx=\"1.2\"/><rect x=\"13.5\" y=\"3\" width=\"7.5\" height=\"9.5\" rx=\"1.2\"/><rect x=\"3\" y=\"16\" width=\"7.5\" height=\"5\" rx=\"1.2\"/><rect x=\"13.5\" y=\"16\" width=\"7.5\" height=\"5\" rx=\"1.2\"/><\/svg><h3>पेज स्टूडियो<\/h3><p>हर पेज सामने — खींचो, घुमाओ, हटाओ, जोड़ो; एक साथ सब कुछ<\/p><\/div>\n    <div class=\"tcard\" data-view=\"view-merge\"><svg viewBox=\"0 0 24 24\"><path d=\"M7 3v7M17 3v7M7 10c0 3 2.5 4.5 5 4.5S17 13 17 10\"/><path d=\"M12 14.5V21M9 18.3l3 3 3-3\"/><\/svg><h3>PDF जोड़ें<\/h3><p>बड़ी फ़ाइलें भी; क्रम से, एकांतर, या बिगड़ी/लॉक PDF की मरम्मत<\/p><\/div>\n    <div class=\"tcard\" data-view=\"view-split\"><svg viewBox=\"0 0 24 24\"><circle cx=\"6\" cy=\"6\" r=\"2.6\"/><circle cx=\"6\" cy=\"18\" r=\"2.6\"/><path d=\"M8.2 7.7 20 19M8.2 16.3 20 5\"/><\/svg><h3>PDF तोड़ें<\/h3><p>रेंज, हर N पेज, सम/विषम, या चुन-चुनकर<\/p><\/div>\n    <div class=\"tcard\" data-view=\"view-wm\"><span class=\"tag\">स्थायी<\/span><svg viewBox=\"0 0 24 24\"><path d=\"M12 3s6 6.4 6 10.3A6 6 0 0 1 6 13.3C6 9.4 12 3 12 3z\"/><path d=\"M9.5 13.5a2.5 2.5 0 0 0 2.5 2.5\"/><\/svg><h3>वॉटरमार्क + फुटर<\/h3><p>दोनों एक ही बार में — रंग अपने-आप मिलता है<\/p><\/div>\n    <div class=\"tcard\" data-view=\"view-img\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"/><circle cx=\"9\" cy=\"10\" r=\"1.7\"/><path d=\"m4 18 5-5 3 3 4-4 4 4\"/><\/svg><h3>इमेज साइज़ / कंप्रेस<\/h3><p>लक्ष्य-KB मोड — फ़ॉर्म की फोटो ठीक उतने KB में<\/p><\/div>\n    <div class=\"tcard\" data-view=\"view-i2p\"><svg viewBox=\"0 0 24 24\"><rect x=\"2.5\" y=\"3\" width=\"8.5\" height=\"8.5\" rx=\"1.4\"/><path d=\"M13.5 7.2h5M16.4 4.8l2.4 2.4-2.4 2.4\"/><rect x=\"12.8\" y=\"12.5\" width=\"8.5\" height=\"8.5\" rx=\"1.4\"/><\/svg><h3>इमेज → PDF<\/h3><p>फोटो सजाओ, पेज-साइज़ चुनो, PDF तैयार<\/p><\/div>\n    <div class=\"tcard\" data-view=\"view-p2i\"><svg viewBox=\"0 0 24 24\"><rect x=\"2.5\" y=\"3\" width=\"8.5\" height=\"10.5\" rx=\"1.4\"/><path d=\"M13.5 8.2h5M16.4 5.8l2.4 2.4-2.4 2.4\"/><rect x=\"12.8\" y=\"13\" width=\"8.5\" height=\"8\" rx=\"1.4\"/><circle cx=\"15.6\" cy=\"16\" r=\"1\"/><path d=\"m13.3 20 2.3-2.2 1.5 1.4 2-2 2.2 2.3\"/><\/svg><h3>PDF → इमेज<\/h3><p>हर पेज तेज़-धार JPG/PNG में<\/p><\/div>\n    <div class=\"tcard\" data-view=\"view-scan\"><svg viewBox=\"0 0 24 24\"><path d=\"M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16\"/><path d=\"M3 12h18\"/><\/svg><h3>स्कैनर<\/h3><p>कैमरा/फोटो → क्रॉप + श्याम-श्वेत जादू → PDF<\/p><\/div>\n    <div class=\"tcard\" data-view=\"view-cpdf\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 3v5.5M9 5.8l3 3 3-3M12 21v-5.5M9 18.2l3-3 3 3\"/><path d=\"M4 12h16\"/><\/svg><h3>PDF कंप्रेस<\/h3><p>भारी PDF को बाँटने-लायक हल्का<\/p><\/div>\n    <div class=\"tcard\" data-view=\"view-pnum\"><svg viewBox=\"0 0 24 24\"><path d=\"M9 3 7 21M17 3l-2 18M4 8.5h17M3 15.5h17\"/><\/svg><h3>पेज नंबर + फ़ुटर<\/h3><p>नंबर कहीं भी, साथ में हर पेज पर अपनी हिंदी लाइन<\/p><\/div>\n  <\/div>\n<\/section>\n\n<!-- ================= STUDIO ================= -->\n<section class=\"view\" id=\"view-studio\">\n  <h2 class=\"vt\">पेज स्टूडियो<\/h2>\n  <p class=\"vd\">कई PDF और फोटो एक साथ लाओ — हर पेज सामने दिखेगा। ⠿ पकड़कर क्रम बदलो, घुमाओ, कॉपी करो, हटाओ, और चाहो तो सिर्फ़ चुने हुए पेजों की नई PDF निकाल लो। जोड़ना-हटाना-सजाना, सब एक ही मेज़ पर।<\/p>\n  <div class=\"toolbar\">\n    <button class=\"btn small\" id=\"st-add\">+ फ़ाइल जोड़ें<\/button>\n    <span class=\"sep\"><\/span>\n    <button class=\"btn ghost small\" id=\"st-selall\">सभी चुनें<\/button>\n    <button class=\"btn ghost small\" id=\"st-selnone\">चयन हटाएँ<\/button>\n    <button class=\"btn ghost small\" id=\"st-rotsel\">चुने घुमाएँ ↻<\/button>\n    <button class=\"btn danger small\" id=\"st-delsel\">चुने हटाएँ<\/button>\n    <span class=\"sep\"><\/span>\n    <button class=\"btn ghost small\" id=\"st-rev\">क्रम उल्टा<\/button>\n    <span class=\"zoomwrap\">आकार <input type=\"range\" id=\"st-zoom\" min=\"90\" max=\"230\" value=\"126\"><\/span>\n  <\/div>\n  <div class=\"pgrid\" id=\"st-grid\"><div class=\"empty\">ऊपर “+ फ़ाइल जोड़ें” दबाओ या फ़ाइलें यहीं खींचकर छोड़ो — PDF और JPG/PNG दोनों चलेंगे।<\/div><\/div>\n  <div class=\"panel\" style=\"margin-top:16px\">\n    <div class=\"row\">\n      <label class=\"f\">फ़ाइल का नाम<\/label>\n      <input type=\"text\" id=\"st-name\" value=\"bodhi-document\" style=\"flex:1;min-width:150px\">\n      <button class=\"btn\" id=\"st-saveall\">पूरा PDF सहेजो<\/button>\n      <button class=\"btn ghost\" id=\"st-savesel\">सिर्फ़ चुने पेजों का PDF<\/button>\n    <\/div>\n  <\/div>\n  <input type=\"file\" id=\"st-file\" class=\"hidden\" multiple accept=\"application/pdf,image/*\">\n<\/section>\n\n<!-- ================= MERGE ================= -->\n<section class=\"view\" id=\"view-merge\">\n  <h2 class=\"vt\">PDF जोड़ें<\/h2>\n  <p class=\"vd\">फ़ाइलें क्रम से जोड़ो, दो PDF के पेज गूँथो (एकांतर), या बिगड़ी/लॉक PDF अकेली डालकर उसकी मरम्मत-कॉपी बनाओ। बड़ी फ़ाइलों के लिए इंजन अब एक-एक फ़ाइल करके काम करता है, ताकि मेमोरी न फटे।<\/p>\n  <div class=\"dropzone\" id=\"mg-drop\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 16V5M7 10l5-5 5 5\"/><path d=\"M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2\"/><\/svg><div class=\"dz1\">PDF फ़ाइलें यहाँ छोड़ो या टैप करो<\/div><div class=\"dz2\">एक साथ कई फ़ाइलें — 100+ MB वाली भी<\/div><\/div>\n  <input type=\"file\" id=\"mg-file\" class=\"hidden\" multiple accept=\"application/pdf\">\n  <div class=\"flist\" id=\"mg-list\"><\/div>\n  <div class=\"row hidden\" id=\"mg-listacts\" style=\"margin:2px 0 10px\"><button class=\"btn ghost small\" id=\"mg-clear\">सूची ख़ाली करो<\/button><span class=\"hint\" id=\"mg-total\"><\/span><\/div>\n  <div class=\"tabs\">\n    <button class=\"tab on\" data-t=\"mg-order\">क्रम से जोड़ो<\/button>\n    <button class=\"tab\" data-t=\"mg-inter\">एकांतर (गूँथकर)<\/button>\n  <\/div>\n  <div class=\"tabpane on\" id=\"mg-order\"><p class=\"hint\">ऊपर सूची में ⠿ पकड़कर फ़ाइलों का क्रम बदलो — उसी क्रम में जुड़ेंगी। 1 फ़ाइल भी चलेगी (सिर्फ़ मरम्मत/री-सेव के लिए)।<\/p><\/div>\n  <div class=\"tabpane\" id=\"mg-inter\">\n    <p class=\"hint\">ठीक 2 फ़ाइलें चाहिए। पेज ऐसे बुनेंगे: पहली का पेज 1, दूसरी का पेज 1, पहली का पेज 2, दूसरी का पेज 2…<\/p>\n    <div class=\"row\" style=\"margin-top:8px\"><label class=\"radio-line\"><input type=\"checkbox\" id=\"mg-rev\"> दूसरी फ़ाइल उल्टे क्रम में लो (पीछे की साइड उल्टी स्कैन हुई हो तो)<\/label><\/div>\n  <\/div>\n  <div class=\"panel\">\n    <div class=\"row\"><label class=\"radio-line\"><input type=\"checkbox\" id=\"mg-fix\" checked> बिगड़ी/लॉक फ़ाइल मिले तो अपने-आप मरम्मत करके जोड़ो (पेज तस्वीर बनकर जुड़ेंगे)<\/label><\/div>\n    <div class=\"row\" style=\"margin-top:10px\"><label class=\"f\">नाम<\/label><input type=\"text\" id=\"mg-name\" value=\"bodhi-merged\" style=\"min-width:150px\"><button class=\"btn\" id=\"mg-go\">जोड़कर डाउनलोड करो<\/button><\/div>\n  <\/div>\n<\/section>\n\n<!-- ================= SPLIT ================= -->\n<section class=\"view\" id=\"view-split\">\n  <h2 class=\"vt\">PDF तोड़ें<\/h2>\n  <p class=\"vd\">पाँच तरीके — रेंज से, हर N पेज पर, हर पेज अलग, सम/विषम, या थंबनेल देखकर मनचाहे पेज चुनकर।<\/p>\n  <div class=\"dropzone\" id=\"sp-drop\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 16V5M7 10l5-5 5 5\"/><path d=\"M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2\"/><\/svg><div class=\"dz1\">एक PDF यहाँ छोड़ो या टैप करो<\/div><div class=\"dz2\">फ़ाइल आपके फ़ोन/कंप्यूटर से बाहर नहीं जाएगी<\/div><\/div>\n  <input type=\"file\" id=\"sp-file\" class=\"hidden\" accept=\"application/pdf\">\n  <div id=\"sp-body\" class=\"hidden\">\n    <div class=\"fileinfo\" id=\"sp-info\"><\/div>\n    <div class=\"tabs\">\n      <button class=\"tab on\" data-t=\"sp-range\">रेंज से<\/button>\n      <button class=\"tab\" data-t=\"sp-every\">हर N पेज<\/button>\n      <button class=\"tab\" data-t=\"sp-single\">हर पेज अलग<\/button>\n      <button class=\"tab\" data-t=\"sp-oe\">सम / विषम<\/button>\n      <button class=\"tab\" data-t=\"sp-pick\">चुनकर निकालो<\/button>\n    <\/div>\n    <div class=\"tabpane on\" id=\"sp-range\">\n      <div class=\"row\"><label class=\"f\">रेंज<\/label><input type=\"text\" id=\"sp-ranges\" placeholder=\"जैसे: 1-5, 8, 11-13\" style=\"flex:1;min-width:170px\"><\/div>\n      <div class=\"row\" style=\"margin-top:8px\">\n        <label class=\"radio-line\"><input type=\"radio\" name=\"sp-rm\" value=\"sep\" checked> हर रेंज की अलग फ़ाइल (ZIP)<\/label>\n        <label class=\"radio-line\"><input type=\"radio\" name=\"sp-rm\" value=\"one\"> सबको मिलाकर एक फ़ाइल<\/label>\n      <\/div>\n    <\/div>\n    <div class=\"tabpane\" id=\"sp-every\"><div class=\"row\"><label class=\"f\">हर<\/label><input type=\"number\" id=\"sp-n\" value=\"2\" min=\"1\"><label class=\"f\">पेज पर नई फ़ाइल बनेगी (सब ZIP में)<\/label><\/div><\/div>\n    <div class=\"tabpane\" id=\"sp-single\"><p class=\"hint\">हर पेज की अलग PDF बनेगी — सब एक ZIP में।<\/p><\/div>\n    <div class=\"tabpane\" id=\"sp-oe\"><p class=\"hint\">दो फ़ाइलें बनेंगी — odd में विषम पेज (1, 3, 5…), even में सम (2, 4, 6…)। डबल-साइड स्कैन सुलझाने में काम आता है।<\/p><\/div>\n    <div class=\"tabpane\" id=\"sp-pick\">\n      <div class=\"row\" style=\"margin:4px 0 10px\"><button class=\"btn ghost small\" id=\"sp-pick-all\">सभी<\/button><button class=\"btn ghost small\" id=\"sp-pick-none\">कोई नहीं<\/button><label class=\"radio-line\"><input type=\"checkbox\" id=\"sp-rem\"> बचे हुए पेजों की भी अलग फ़ाइल बनाओ<\/label><\/div>\n      <div class=\"pgrid\" id=\"sp-grid\"><\/div>\n    <\/div>\n    <div class=\"panel\"><div class=\"row\"><label class=\"f\">नाम<\/label><input type=\"text\" id=\"sp-name\" value=\"bodhi-split\" style=\"min-width:150px\"><button class=\"btn\" id=\"sp-go\">तोड़कर डाउनलोड करो<\/button><\/div><\/div>\n  <\/div>\n<\/section>\n\n<!-- ================= WATERMARK ================= -->\n<section class=\"view\" id=\"view-wm\">\n  <h2 class=\"vt\">वॉटरमार्क<\/h2>\n  <p class=\"vd\">लिखो या लोगो लगाओ — हर बदलाव उसी पल पेज पर दिखेगा। “स्थायी” मोड में वॉटरमार्क पिक्सेल में घुल जाता है, और नीचे की “सुरक्षा” उसे ऐसा बना देती है कि AI-remover एक बार में साफ़ न काट पाए — तुम्हारा चुना रूप बदले बिना।<\/p>\n  <div class=\"dropzone\" id=\"wm-drop\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 16V5M7 10l5-5 5 5\"/><path d=\"M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2\"/><\/svg><div class=\"dz1\">PDF यहाँ छोड़ो या टैप करो<\/div><div class=\"dz2\">प्रीव्यू तुरंत खुल जाएगा<\/div><\/div>\n  <input type=\"file\" id=\"wm-file\" class=\"hidden\" multiple accept=\"application/pdf,image/*\">\n  <div id=\"wm-body\" class=\"hidden\">\n    <div class=\"panel\" id=\"wm-edit\" style=\"margin-bottom:14px\">\n      <div class=\"edhead\">\n        <h4 style=\"margin:0\">पेज संपादन — जोड़ो, हटाओ, क्रम बदलो · सब यहीं<\/h4>\n        <button class=\"btn ghost small\" id=\"wm-ed-toggle\">छिपाओ<\/button>\n      <\/div>\n      <div id=\"wm-ed-box\">\n        <p class=\"hint\" style=\"margin:8px 0 10px\">और PDF या फोटो जोड़ो, बेकार पेज हटाओ, क्रम बदलो, घुमाओ — फिर नीचे “बदलाव लागू करो” दबाओ। ऊपर की झलक और वॉटरमार्क-फुटर वाला डाउनलोड उसी बदली हुई फ़ाइल पर चलेगा। दूसरा टूल खोलने की ज़रूरत नहीं।<\/p>\n        <div id=\"wm-ed-srcs\" style=\"margin-bottom:10px\"><\/div>\n        <div class=\"toolbar\" style=\"margin-bottom:10px\">\n          <button class=\"btn small\" id=\"wm-ed-add\">+ PDF / फोटो जोड़ें<\/button>\n          <span class=\"sep\"><\/span>\n          <button class=\"btn ghost small\" id=\"wm-ed-selall\">सभी चुनें<\/button>\n          <button class=\"btn ghost small\" id=\"wm-ed-selnone\">चयन हटाएँ<\/button>\n          <button class=\"btn ghost small\" id=\"wm-ed-rotsel\">चुने घुमाएँ ↻<\/button>\n          <button class=\"btn danger small\" id=\"wm-ed-delsel\">चुने हटाएँ<\/button>\n          <span class=\"sep\"><\/span>\n          <button class=\"btn ghost small\" id=\"wm-ed-rev\">क्रम उल्टा<\/button>\n          <span class=\"zoomwrap\">आकार <input type=\"range\" id=\"wm-ed-zoom\" min=\"90\" max=\"230\" value=\"126\"><\/span>\n        <\/div>\n        <div class=\"pgrid\" id=\"wm-ed-grid\"><\/div>\n        <div class=\"row\" style=\"margin-top:12px\">\n          <button class=\"btn\" id=\"wm-ed-apply\">बदलाव लागू करो<\/button>\n          <button class=\"btn ghost\" id=\"wm-ed-save\">बिना वॉटरमार्क के सहेजो<\/button>\n          <span class=\"hint\" id=\"wm-ed-info\"><\/span>\n        <\/div>\n      <\/div>\n      <input type=\"file\" id=\"wm-ed-file\" class=\"hidden\" multiple accept=\"application/pdf,image/*\">\n    <\/div>\n    <div class=\"wm-layout\">\n      <div>\n        <div class=\"wm-stage\"><div class=\"wm-stack\"><canvas id=\"wm-base\"><\/canvas><canvas id=\"wm-ovl\" class=\"ovl\"><\/canvas><\/div><\/div>\n        <div class=\"pgnav\"><button class=\"btn ghost small\" id=\"wm-prev\">◀<\/button><span id=\"wm-pglabel\">पेज 1<\/span><button class=\"btn ghost small\" id=\"wm-next\">▶<\/button><\/div>\n      <\/div>\n      <div>\n        <div class=\"panel\">\n          <h4>क्या लगाना है<\/h4>\n          <div class=\"row\">\n            <label class=\"radio-line\"><input type=\"radio\" name=\"wm-type\" value=\"text\" checked> टेक्स्ट<\/label>\n            <label class=\"radio-line\"><input type=\"radio\" name=\"wm-type\" value=\"img\"> लोगो / इमेज<\/label>\n          <\/div>\n          <div id=\"wm-textwrap\">\n            <div class=\"row\" style=\"margin-top:10px\"><input type=\"text\" id=\"wm-text\" value=\"BODHI CLASSES\" style=\"flex:1;min-width:150px\"><\/div>\n            <div class=\"row\" style=\"margin-top:10px\">\n              <label class=\"f\">रंग<\/label>\n              <label class=\"radio-line\"><input type=\"radio\" name=\"wm-cmode\" value=\"auto\" checked> अपने-आप<\/label>\n              <label class=\"radio-line\"><input type=\"radio\" name=\"wm-cmode\" value=\"own\"> अपना<\/label>\n              <input type=\"color\" id=\"wm-color\" value=\"#d8b24a\">\n              <label class=\"radio-line\" style=\"margin-left:6px\"><input type=\"checkbox\" id=\"wm-bold\" checked> मोटा<\/label>\n            <\/div>\n            <p class=\"hint\">“अपने-आप” में हर जगह का रंग खुद तय होता है — गहरी पृष्ठभूमि पर हल्का, हल्की पर गहरा — इसलिए वॉटरमार्क हर स्लाइड पर दिखता भी है और content भी नहीं ढकता।<\/p>\n          <\/div>\n          <div id=\"wm-imgwrap\" class=\"hidden\">\n            <div class=\"row\" style=\"margin-top:10px\"><button class=\"btn ghost small\" id=\"wm-logobtn\">लोगो चुनो<\/button><span class=\"hint\" id=\"wm-logoname\">अभी कोई फ़ाइल नहीं<\/span><\/div>\n            <input type=\"file\" id=\"wm-logo\" class=\"hidden\" accept=\"image/*\">\n          <\/div>\n        <\/div>\n        <div class=\"panel\">\n          <h4>रूप<\/h4>\n          <div class=\"slider-line\"><span>आकार<\/span><input type=\"range\" id=\"wm-size\" min=\"4\" max=\"40\" value=\"10\"><output id=\"o-size\">10%<\/output><\/div>\n          <div class=\"slider-line\"><span>गहरापन<\/span><input type=\"range\" id=\"wm-op\" min=\"4\" max=\"100\" value=\"14\"><output id=\"o-op\">14%<\/output><\/div>\n          <div class=\"slider-line\"><span>घुमाव<\/span><input type=\"range\" id=\"wm-rot\" min=\"-90\" max=\"90\" value=\"-30\"><output id=\"o-rot\">-30°<\/output><\/div>\n        <\/div>\n        <div class=\"panel\">\n          <h4>दो परतें — दोनों साथ चल सकती हैं<\/h4>\n\n          <label class=\"radio-line\" style=\"margin-top:6px\"><input type=\"checkbox\" id=\"wm-use-classic\" checked> <b>सामान्य वॉटरमार्क<\/b> — जैसा सबके notes में होता है (तिरछा / जाल)<\/label>\n          <div id=\"wm-classic-box\" style=\"margin:8px 0 4px 22px;padding-left:10px;border-left:2px solid rgba(216,178,74,.3)\">\n            <div class=\"row\" style=\"margin-bottom:8px\">\n              <label class=\"radio-line\"><input type=\"radio\" name=\"wm-place\" value=\"tile\"> जाल — पूरे पेज पर<\/label>\n              <label class=\"radio-line\"><input type=\"radio\" name=\"wm-place\" value=\"one\" checked> एक जगह<\/label>\n            <\/div>\n            <div class=\"row\" id=\"wm-posrow\">\n              <div class=\"posgrid\" id=\"wm-pos\">\n                <button data-p=\"tl\" title=\"ऊपर-बाएँ\"><\/button><button data-p=\"tc\" title=\"ऊपर-बीच\"><\/button><button data-p=\"tr\" title=\"ऊपर-दाएँ\"><\/button>\n                <button data-p=\"ml\" title=\"बीच-बाएँ\"><\/button><button data-p=\"c\" class=\"on\" title=\"बीचोंबीच\"><\/button><button data-p=\"mr\" title=\"बीच-दाएँ\"><\/button>\n                <button data-p=\"bl\" title=\"नीचे-बाएँ\"><\/button><button data-p=\"bc\" title=\"नीचे-बीच\"><\/button><button data-p=\"br\" title=\"नीचे-दाएँ\"><\/button>\n              <\/div>\n              <input type=\"checkbox\" id=\"wm-tile\" class=\"hidden\">\n            <\/div>\n            <div class=\"slider-line\" style=\"margin-top:10px\"><span>किनारे से दूरी<\/span><input type=\"range\" id=\"wm-margin\" min=\"0\" max=\"20\" value=\"13\"><output id=\"o-margin\">13%<\/output><\/div>\n            <div class=\"slider-line\"><span>जाल में फ़ासला<\/span><input type=\"range\" id=\"wm-gap\" min=\"10\" max=\"200\" value=\"66\"><output id=\"o-gap\">66%<\/output><\/div>\n            <p class=\"hint\">इसका आकार, गहरापन और घुमाव ऊपर “रूप” में हैं।<\/p>\n          <\/div>\n\n          <label class=\"radio-line\" style=\"margin-top:12px\"><input type=\"checkbox\" id=\"wm-use-lock\" checked> 🛡️ <b>पाठ-बंध<\/b> — कुछ छापें सीधे text-लाइनों पर (असली सुरक्षा)<\/label>\n          <div id=\"wm-lock-box\" style=\"margin:8px 0 4px 22px;padding-left:10px;border-left:2px solid rgba(216,178,74,.3)\">\n            <div class=\"slider-line\"><span>कितनी छापें<\/span><input type=\"range\" id=\"wm-lockn\" min=\"2\" max=\"12\" value=\"3\"><output id=\"o-lockn\">3<\/output><\/div>\n            <div class=\"slider-line\"><span>इसका गहरापन<\/span><input type=\"range\" id=\"wm-lockop\" min=\"4\" max=\"60\" value=\"8\"><output id=\"o-lockop\">8%<\/output><\/div>\n            <div class=\"slider-line\"><span>इसका आकार<\/span><input type=\"range\" id=\"wm-locksz\" min=\"6\" max=\"30\" value=\"8\"><output id=\"o-locksz\">8<\/output><\/div>\n            <p class=\"hint\">कोई AI इन्हें हटाए तो वहीं की पंक्ति धुँधली-टूटी हो जाती है — चोर की copy में तथ्य ही नष्ट। परखा हुआ: गहरापन 6% पर भी 65% text टूटता है, यानी <b>जितना हल्का चाहो कर लो, सुरक्षा नहीं घटती<\/b>।<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"panel\">\n          <h4>किन पेजों पर<\/h4>\n          <div class=\"row\">\n            <label class=\"radio-line\"><input type=\"radio\" name=\"wm-pg\" value=\"all\" checked> सभी<\/label>\n            <label class=\"radio-line\"><input type=\"radio\" name=\"wm-pg\" value=\"odd\"> विषम<\/label>\n            <label class=\"radio-line\"><input type=\"radio\" name=\"wm-pg\" value=\"even\"> सम<\/label>\n            <label class=\"radio-line\"><input type=\"radio\" name=\"wm-pg\" value=\"custom\"> रेंज<\/label>\n            <input type=\"text\" id=\"wm-range\" placeholder=\"1-3, 7\" style=\"width:110px\">\n          <\/div>\n        <\/div>\n        <div class=\"panel\">\n          <h4>कैसे लगे<\/h4>\n          <label class=\"radio-line\"><input type=\"radio\" name=\"wm-mode\" value=\"perm\" checked> स्थायी — वॉटरमार्क पिक्सेल में fuse; नीचे की सुरक्षा भी इसी में चलती है (सिफ़ारिशी)<\/label>\n          <label class=\"radio-line\" style=\"margin-top:8px\"><input type=\"radio\" name=\"wm-mode\" value=\"layer\"> साधारण — फ़ाइल हल्की, टेक्स्ट select रहेगा (सुरक्षा कम)<\/label>\n          <div class=\"row\" style=\"margin-top:10px\" id=\"wm-qualrow\"><label class=\"f\">स्थायी गुणवत्ता<\/label><select id=\"wm-qual\"><option value=\"2\">उच्च (2x)<\/option><option value=\"1.5\" selected>संतुलित (1.5x)<\/option><option value=\"1.2\">हल्की फ़ाइल (1.2x)<\/option><\/select><\/div>\n          <p class=\"hint warn\" style=\"margin-top:8px\">स्थायी मोड में पेज फोटो जैसा बन जाता है — टेक्स्ट select/copy नहीं होगा। यही उसकी ताक़त भी है।<\/p>\n        <\/div>\n        <div class=\"panel\" id=\"wm-secure\">\n          <h4>छिपी सुरक्षा — असली रखवाली यही है<\/h4>\n          <label class=\"radio-line\"><input type=\"checkbox\" id=\"wm-sec-on\" checked> चालू रखो — पेज में एक अदृश्य छाप गड़ जाती है (आँख से बिलकुल नहीं दिखती, content पर असर शून्य)। कोई तुम्हारा वॉटरमार्क मिटा भी दे, तो नीचे “चोरी की जाँच” में डालते ही फ़ाइल तुम्हारी साबित हो जाती है।<\/label>\n          <div class=\"row\" style=\"margin-top:8px\"><label class=\"f\">गुप्त कुंजी<\/label><input type=\"text\" id=\"wm-sec-key\" value=\"BODHI\" style=\"width:120px\"><\/div>\n          <p class=\"hint\" style=\"margin-top:8px\">यह “स्थायी” मोड में चलती है और दिखने वाले वॉटरमार्क को ज़रा भी नहीं बदलती — बस साथ में हर पेज को हल्का सा अलग बुनकर सब-पेज-मिलाकर-हटाओ वाली चाल भी तोड़ देती है।<\/p>\n        <\/div>\n        <div class=\"panel\" id=\"wm-footer\">\n          <h4>फुटर — उसी बार में लग जाएगा<\/h4>\n          <label class=\"radio-line\"><input type=\"checkbox\" id=\"wm-ft-on\" checked> हर पेज के नीचे ब्रांडेड फुटर लगाओ (रंग हर slide के निचले हिस्से से हूबहू अपने-आप match होगा — रंगीन slides पर भी; Telegram, YouTube व Gmail पर क्लिक-लिंक)<\/label>\n          <div id=\"wm-ft-box\" style=\"margin-top:8px\">\n            <div class=\"row\" style=\"margin-top:6px\"><label class=\"f\">ब्रांड<\/label><input type=\"text\" id=\"wm-ft-brand\" value=\"BODHI CLASSES\" style=\"flex:1;min-width:130px\"><\/div>\n            <div class=\"row\" style=\"margin-top:8px\"><label class=\"f\">Prepared by<\/label><input type=\"text\" id=\"wm-ft-name\" value=\"Aditya Chauhan\" style=\"flex:1;min-width:130px\"><\/div>\n            <div class=\"row\" style=\"margin-top:8px\"><label class=\"f\">Telegram<\/label><input type=\"text\" id=\"wm-ft-tg\" value=\"t.me/bodhiclassesupsc\" style=\"flex:1;min-width:130px\"><\/div>\n            <div class=\"row\" style=\"margin-top:8px\"><label class=\"f\">YouTube<\/label><input type=\"text\" id=\"wm-ft-yt\" value=\"@BodhiClasses\" style=\"flex:1;min-width:130px\"><\/div>\n            <div class=\"row\" style=\"margin-top:8px\"><label class=\"f\">Gmail<\/label><input type=\"text\" id=\"wm-ft-gm\" value=\"aditya31chauhan@gmail.com\" style=\"flex:1;min-width:130px\"><\/div>\n            <div class=\"slider-line\" style=\"margin-top:10px\"><span>फुटर की ऊँचाई<\/span><input type=\"range\" id=\"wm-ft-h\" min=\"28\" max=\"90\" value=\"48\"><output id=\"o-ft-h\">4.8%<\/output><\/div>\n            <div class=\"slider-line\"><span>अक्षर का आकार<\/span><input type=\"range\" id=\"wm-ft-t\" min=\"75\" max=\"150\" value=\"100\"><output id=\"o-ft-t\">100%<\/output><\/div>\n            <label class=\"radio-line\" style=\"margin-top:8px\"><input type=\"checkbox\" id=\"wm-ft-links\" checked> क्लिक-लिंक चालू<\/label>\n            <p class=\"hint\" style=\"margin-top:8px\">अब दो बार काम नहीं — वॉटरमार्क और फुटर एक ही डाउनलोड में। फुटर वॉटरमार्क के ऊपर बैठता है, इसलिए साफ़ पढ़ा जाता है।<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"panel\">\n          <div class=\"row\"><label class=\"f\">नाम<\/label><input type=\"text\" id=\"wm-name\" value=\"bodhi-watermarked\" style=\"flex:1;min-width:130px\"><\/div>\n          <div class=\"row\" style=\"margin-top:10px\"><button class=\"btn\" id=\"wm-go\" style=\"width:100%;justify-content:center\">वॉटरमार्क + फुटर लगाकर डाउनलोड करो<\/button><\/div>\n        <\/div>\n        <div class=\"panel\" id=\"wm-detect\">\n          <h4>चोरी की जाँच<\/h4>\n          <p class=\"hint\" style=\"margin-top:2px\">तुम्हारी slide कहीं घूमती मिले तो उसकी तस्वीर यहाँ डालो। “जाँचो” गुप्त कुंजी से छिपा कोड परखता है; “छाया दिखाओ” छिपी छाप को जगमगाकर दिखाता है — वॉटरमार्क मिटाया गया हो तो भी। बिना काटी तस्वीर पर सबसे भरोसेमंद।<\/p>\n          <div class=\"row\" style=\"margin-top:10px\"><button class=\"btn ghost small\" id=\"wm-dt-pick\">तस्वीर चुनो<\/button><span class=\"hint\" id=\"wm-dt-name\">कोई फ़ाइल नहीं<\/span><\/div>\n          <input type=\"file\" id=\"wm-dt-file\" class=\"hidden\" accept=\"image/*\">\n          <div class=\"row\" style=\"margin-top:8px\"><label class=\"f\">गुप्त कुंजी<\/label><input type=\"text\" id=\"wm-dt-key\" value=\"BODHI\" style=\"width:120px\"><button class=\"btn small\" id=\"wm-dt-go\">जाँचो<\/button><button class=\"btn ghost small\" id=\"wm-dt-ghost\">छाया दिखाओ<\/button><\/div>\n          <div class=\"hint\" id=\"wm-dt-res\" style=\"margin-top:8px\"><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ================= IMAGE ================= -->\n<section class=\"view\" id=\"view-img\">\n  <h2 class=\"vt\">इमेज साइज़ / कंप्रेस<\/h2>\n  <p class=\"vd\">फोटो छोटी करो, KB घटाओ, फ़ॉर्मैट बदलो — और सबसे काम की चीज़: “लक्ष्य KB” मोड, जो फोटो को ठीक उतने KB में उतार देता है जितना फ़ॉर्म माँगता है।<\/p>\n  <div class=\"dropzone\" id=\"im-drop\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"/><circle cx=\"9\" cy=\"10\" r=\"1.7\"/><path d=\"m4 18 5-5 3 3 4-4 4 4\"/><\/svg><div class=\"dz1\">फोटो यहाँ छोड़ो या टैप करो<\/div><div class=\"dz2\">JPG · PNG · WebP — एक साथ कई<\/div><\/div>\n  <input type=\"file\" id=\"im-file\" class=\"hidden\" multiple accept=\"image/*\">\n  <div id=\"im-body\" class=\"hidden\">\n    <div class=\"panel\">\n      <h4>आकार<\/h4>\n      <div class=\"row\">\n        <label class=\"radio-line\"><input type=\"radio\" name=\"im-rs\" value=\"none\" checked> जैसा है<\/label>\n        <label class=\"radio-line\"><input type=\"radio\" name=\"im-rs\" value=\"pct\"> प्रतिशत<\/label>\n        <label class=\"radio-line\"><input type=\"radio\" name=\"im-rs\" value=\"wh\"> चौड़ाई / ऊँचाई<\/label>\n      <\/div>\n      <div class=\"slider-line\" id=\"im-pctrow\" style=\"margin-top:10px;display:none\"><span>प्रतिशत<\/span><input type=\"range\" id=\"im-pct\" min=\"5\" max=\"100\" value=\"50\"><output id=\"o-impct\">50%<\/output><\/div>\n      <div class=\"row\" id=\"im-whrow\" style=\"margin-top:10px;display:none\">\n        <label class=\"f\">चौड़ाई px<\/label><input type=\"number\" id=\"im-w\" min=\"1\" placeholder=\"जैसे 800\">\n        <label class=\"f\">ऊँचाई px<\/label><input type=\"number\" id=\"im-h\" min=\"1\" placeholder=\"खाली छोड़ो\">\n        <label class=\"radio-line\"><input type=\"checkbox\" id=\"im-lock\" checked> अनुपात बनाए रखो<\/label>\n      <\/div>\n    <\/div>\n    <div class=\"panel\">\n      <h4>कंप्रेशन<\/h4>\n      <div class=\"row\">\n        <label class=\"radio-line\"><input type=\"radio\" name=\"im-cm\" value=\"q\" checked> गुणवत्ता से<\/label>\n        <label class=\"radio-line\"><input type=\"radio\" name=\"im-cm\" value=\"kb\"> लक्ष्य KB से<\/label>\n      <\/div>\n      <div class=\"slider-line\" id=\"im-qrow\" style=\"margin-top:10px\"><span>गुणवत्ता<\/span><input type=\"range\" id=\"im-q\" min=\"10\" max=\"100\" value=\"80\"><output id=\"o-imq\">80%<\/output><\/div>\n      <div id=\"im-kbrow\" style=\"margin-top:10px;display:none\">\n        <div class=\"row\"><label class=\"f\">लक्ष्य<\/label><input type=\"number\" id=\"im-kb\" value=\"50\" min=\"5\"><label class=\"f\">KB<\/label>\n          <button class=\"preset\" data-kb=\"20\">20 KB — हस्ताक्षर<\/button>\n          <button class=\"preset\" data-kb=\"50\">50 KB — फोटो<\/button>\n          <button class=\"preset\" data-kb=\"100\">100 KB<\/button>\n          <button class=\"preset\" data-kb=\"200\">200 KB<\/button>\n        <\/div>\n        <p class=\"hint\" style=\"margin-top:6px\">फ़ॉर्म-अपलोड के लिए बना है — गुणवत्ता अपने-आप ऐसी बैठेगी कि साइज़ लक्ष्य के अंदर रहे।<\/p>\n      <\/div>\n      <div class=\"row\" style=\"margin-top:10px\"><label class=\"f\">फ़ॉर्मैट<\/label><select id=\"im-fmt\"><option value=\"keep\">जो है वही<\/option><option value=\"jpeg\">JPG<\/option><option value=\"png\">PNG<\/option><option value=\"webp\">WebP<\/option><\/select><span class=\"hint\" id=\"im-est\"><\/span><\/div>\n    <\/div>\n    <div class=\"row\" style=\"margin-top:14px\"><button class=\"btn\" id=\"im-go\">सब पर लागू करो<\/button><button class=\"btn ghost hidden\" id=\"im-zip\">सब ZIP में डाउनलोड<\/button><\/div>\n    <div class=\"imglist\" id=\"im-list\"><\/div>\n  <\/div>\n<\/section>\n\n<!-- ================= IMG TO PDF ================= -->\n<section class=\"view\" id=\"view-i2p\">\n  <h2 class=\"vt\">इमेज → PDF<\/h2>\n  <p class=\"vd\">फोटो चुनो, ⠿ से क्रम सजाओ, पेज-साइज़ तय करो — एक साफ़-सुथरी PDF तैयार।<\/p>\n  <div class=\"dropzone\" id=\"ip-drop\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"/><circle cx=\"9\" cy=\"10\" r=\"1.7\"/><path d=\"m4 18 5-5 3 3 4-4 4 4\"/><\/svg><div class=\"dz1\">फोटो यहाँ छोड़ो या टैप करो<\/div><div class=\"dz2\">जिस क्रम में सजाओगे, उसी क्रम में पेज बनेंगे<\/div><\/div>\n  <input type=\"file\" id=\"ip-file\" class=\"hidden\" multiple accept=\"image/*\">\n  <div id=\"ip-body\" class=\"hidden\">\n    <div class=\"flist\" id=\"ip-list\"><\/div>\n    <div class=\"panel\">\n      <div class=\"row\">\n        <label class=\"f\">पेज<\/label><select id=\"ip-size\"><option value=\"a4\" selected>A4<\/option><option value=\"letter\">Letter<\/option><option value=\"img\">इमेज के आकार का<\/option><\/select>\n        <label class=\"f\">दिशा<\/label><select id=\"ip-orient\"><option value=\"auto\" selected>अपने-आप<\/option><option value=\"p\">खड़ा<\/option><option value=\"l\">लेटा<\/option><\/select>\n        <label class=\"f\">हाशिया (mm)<\/label><input type=\"number\" id=\"ip-margin\" value=\"10\" min=\"0\" max=\"40\">\n      <\/div>\n      <div class=\"slider-line\" style=\"margin-top:10px\"><span>गुणवत्ता<\/span><input type=\"range\" id=\"ip-q\" min=\"40\" max=\"100\" value=\"85\"><output id=\"o-ipq\">85%<\/output><\/div>\n      <div class=\"row\" style=\"margin-top:12px\"><label class=\"f\">नाम<\/label><input type=\"text\" id=\"ip-name\" value=\"bodhi-images\" style=\"min-width:150px\"><button class=\"btn\" id=\"ip-go\">PDF बनाओ<\/button><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ================= PDF TO IMG ================= -->\n<section class=\"view\" id=\"view-p2i\">\n  <h2 class=\"vt\">PDF → इमेज<\/h2>\n  <p class=\"vd\">हर पेज साफ़ इमेज में — नोट्स को स्टेटस, पोस्ट या थंबनेल बनाने के लिए बढ़िया।<\/p>\n  <div class=\"dropzone\" id=\"pi-drop\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 16V5M7 10l5-5 5 5\"/><path d=\"M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2\"/><\/svg><div class=\"dz1\">PDF यहाँ छोड़ो या टैप करो<\/div><div class=\"dz2\">एक से ज़्यादा पेज हों तो ZIP मिलेगी<\/div><\/div>\n  <input type=\"file\" id=\"pi-file\" class=\"hidden\" accept=\"application/pdf\">\n  <div id=\"pi-body\" class=\"hidden\">\n    <div class=\"fileinfo\" id=\"pi-info\"><\/div>\n    <div class=\"panel\"><div class=\"row\">\n      <label class=\"f\">गुणवत्ता<\/label><select id=\"pi-scale\"><option value=\"1\">सामान्य (1x)<\/option><option value=\"2\" selected>तेज़-धार (2x)<\/option><option value=\"3\">प्रिंट (3x)<\/option><\/select>\n      <label class=\"f\">फ़ॉर्मैट<\/label><select id=\"pi-fmt\"><option value=\"jpeg\" selected>JPG<\/option><option value=\"png\">PNG<\/option><\/select>\n      <label class=\"f\">पेज<\/label><input type=\"text\" id=\"pi-range\" placeholder=\"खाली = सभी\" style=\"width:130px\">\n      <button class=\"btn\" id=\"pi-go\">इमेज बनाओ<\/button>\n    <\/div><\/div>\n  <\/div>\n<\/section>\n\n<!-- ================= SCANNER ================= -->\n<section class=\"view\" id=\"view-scan\">\n  <h2 class=\"vt\">स्कैनर<\/h2>\n  <p class=\"vd\">कैमरे से खींचो या फोटो चुनो — क्रॉप, घुमाव और “श्याम-श्वेत जादू” फ़िल्टर से काग़ज़ स्कैनर-जैसा साफ़। पेज जोड़ते जाओ, अंत में एक PDF।<\/p>\n  <div class=\"row\">\n    <button class=\"btn\" id=\"sc-cam\">📷 कैमरे से खींचो<\/button>\n    <button class=\"btn ghost\" id=\"sc-pick\">गैलरी से चुनो<\/button>\n  <\/div>\n  <input type=\"file\" id=\"sc-file-cam\" class=\"hidden\" accept=\"image/*\" capture=\"environment\">\n  <input type=\"file\" id=\"sc-file\" class=\"hidden\" accept=\"image/*\">\n  <div id=\"sc-body\" class=\"hidden\" style=\"margin-top:14px\">\n    <div class=\"sc-stage\"><div class=\"sc-wrap\" id=\"sc-wrap\"><canvas id=\"sc-canvas\"><\/canvas><div class=\"cropbox\" id=\"sc-crop\"><\/div><\/div><\/div>\n    <div class=\"panel\" style=\"margin-top:12px\">\n      <h4>फ़िल्टर<\/h4>\n      <div class=\"filterchips\" id=\"sc-filters\">\n        <button class=\"fchip on\" data-f=\"orig\">मूल<\/button>\n        <button class=\"fchip\" data-f=\"bright\">उजला<\/button>\n        <button class=\"fchip\" data-f=\"gray\">ग्रे<\/button>\n        <button class=\"fchip\" data-f=\"bw\">श्याम-श्वेत जादू<\/button>\n      <\/div>\n      <div class=\"slider-line\" style=\"margin-top:12px\"><span>चमक<\/span><input type=\"range\" id=\"sc-br\" min=\"-60\" max=\"60\" value=\"0\"><output id=\"o-scbr\">0<\/output><\/div>\n      <div class=\"slider-line\"><span>कंट्रास्ट<\/span><input type=\"range\" id=\"sc-ct\" min=\"-60\" max=\"60\" value=\"0\"><output id=\"o-scct\">0<\/output><\/div>\n      <div class=\"row\" style=\"margin-top:12px\">\n        <button class=\"btn ghost small\" id=\"sc-rot\">↻ घुमाओ<\/button>\n        <button class=\"btn ghost small\" id=\"sc-cropgo\">क्रॉप लागू करो<\/button>\n        <button class=\"btn ghost small\" id=\"sc-reset\">रीसेट<\/button>\n      <\/div>\n      <p class=\"hint\" style=\"margin-top:8px\">क्रॉप: तस्वीर पर उँगली/माउस से डिब्बा खींचो, फिर “क्रॉप लागू करो” दबाओ।<\/p>\n      <div class=\"row\" style=\"margin-top:12px\"><button class=\"btn\" id=\"sc-addpg\">+ इस पेज को जोड़ो<\/button><\/div>\n    <\/div>\n    <div class=\"sc-pages\" id=\"sc-pages\"><\/div>\n    <div class=\"panel\" style=\"margin-top:12px\"><div class=\"row\"><label class=\"f\">नाम<\/label><input type=\"text\" id=\"sc-name\" value=\"bodhi-scan\" style=\"min-width:150px\"><button class=\"btn\" id=\"sc-pdf\">📄 सारे पेजों की PDF<\/button><\/div><\/div>\n  <\/div>\n<\/section>\n\n<!-- ================= COMPRESS PDF ================= -->\n<section class=\"view\" id=\"view-cpdf\">\n  <h2 class=\"vt\">PDF कंप्रेस<\/h2>\n  <p class=\"vd\">भारी PDF को Telegram/WhatsApp पर बाँटने-लायक हल्का करो। पेज इमेज में बदलकर दबाए जाते हैं — नोट्स और स्कैन के लिए एकदम सही।<\/p>\n  <div class=\"dropzone\" id=\"cp-drop\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 16V5M7 10l5-5 5 5\"/><path d=\"M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2\"/><\/svg><div class=\"dz1\">PDF यहाँ छोड़ो या टैप करो<\/div><div class=\"dz2\">पहले-बाद का साइज़ सामने दिखेगा<\/div><\/div>\n  <input type=\"file\" id=\"cp-file\" class=\"hidden\" accept=\"application/pdf\">\n  <div id=\"cp-body\" class=\"hidden\">\n    <div class=\"fileinfo\" id=\"cp-info\"><\/div>\n    <div class=\"panel\">\n      <label class=\"radio-line\"><input type=\"radio\" name=\"cp-lv\" value=\"light\"> हल्का — गुणवत्ता लगभग जस की तस<\/label>\n      <label class=\"radio-line\" style=\"margin-top:8px\"><input type=\"radio\" name=\"cp-lv\" value=\"mid\" checked> संतुलित — पढ़ने में साफ़, साइज़ काफ़ी कम<\/label>\n      <label class=\"radio-line\" style=\"margin-top:8px\"><input type=\"radio\" name=\"cp-lv\" value=\"max\"> अधिकतम — सबसे छोटी फ़ाइल<\/label>\n      <p class=\"hint warn\" style=\"margin-top:10px\">कंप्रेस के बाद टेक्स्ट select नहीं होगा (पेज फोटो बन जाते हैं)।<\/p>\n      <div class=\"row\" style=\"margin-top:12px\"><label class=\"f\">नाम<\/label><input type=\"text\" id=\"cp-name\" value=\"bodhi-compressed\" style=\"min-width:150px\"><button class=\"btn\" id=\"cp-go\">कंप्रेस करो<\/button><\/div>\n    <\/div>\n    <div class=\"resultbox\" id=\"cp-result\"><h4>✔ हो गया<\/h4><div class=\"stat\"><\/div><\/div>\n  <\/div>\n<\/section>\n\n<!-- ================= PAGE NUMBERS ================= -->\n<section class=\"view\" id=\"view-pnum\">\n  <h2 class=\"vt\">पेज नंबर + फ़ुटर<\/h2>\n  <p class=\"vd\">जहाँ चाहो वहाँ नंबर — कोने, बीच, ऊपर, नीचे; कवर वग़ैरह शुरुआती पेज छोड़ने की सुविधा भी। साथ में हर पेज पर अपनी फ़ुटर-लाइन (हिंदी में भी) — चैनल/टेलीग्राम की छाप एक ही बार में।<\/p>\n  <div class=\"dropzone\" id=\"pn-drop\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 16V5M7 10l5-5 5 5\"/><path d=\"M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2\"/><\/svg><div class=\"dz1\">PDF यहाँ छोड़ो या टैप करो<\/div><div class=\"dz2\">नंबर की जगह, आकार, रंग — सब आपके हाथ<\/div><\/div>\n  <input type=\"file\" id=\"pn-file\" class=\"hidden\" accept=\"application/pdf\">\n  <div id=\"pn-body\" class=\"hidden\">\n    <div class=\"fileinfo\" id=\"pn-info\"><\/div>\n    <div class=\"panel\">\n      <div class=\"row\">\n        <label class=\"f\">जगह<\/label><select id=\"pn-pos\"><option value=\"bc\" selected>नीचे बीच<\/option><option value=\"bl\">नीचे बाएँ<\/option><option value=\"br\">नीचे दाएँ<\/option><option value=\"tc\">ऊपर बीच<\/option><option value=\"tl\">ऊपर बाएँ<\/option><option value=\"tr\">ऊपर दाएँ<\/option><\/select>\n        <label class=\"f\">ढंग<\/label><select id=\"pn-fmt\"><option value=\"#\" selected>1<\/option><option value=\"# / N\">1 / N<\/option><option value=\"- # -\">- 1 -<\/option><option value=\"Page # of N\">Page 1 of N<\/option><\/select>\n        <label class=\"f\">आकार<\/label><input type=\"number\" id=\"pn-size\" value=\"11\" min=\"6\" max=\"36\">\n      <\/div>\n      <div class=\"row\" style=\"margin-top:10px\">\n        <label class=\"f\">गिनती शुरू<\/label><input type=\"number\" id=\"pn-start\" value=\"1\" min=\"0\">\n        <label class=\"f\">शुरू के इतने पेज छोड़ो<\/lab s:[],colors:['#D8B24A','#6FA8FF','#7BD09A','#F08A8A','#C79BF0','#FFB86B'],ci:0,dirty:false};}\nvar ST=newPageState();\nfunction stUid(){return 'p'+Math.random().toString(36).slice(2,9);}\n$('#st-add').addEventListener('click',function(){$('#st-file').click();});\n$('#st-file').addEventListener('change',function(e){var fs=Array.from(e.target.files);e.target.value='';if(fs.length)stAdd(fs);});\n(function(){\n  var z=$('#view-studio');\n  ['dragover','dragenter'].forEach(function(ev){z.addEventListener(ev,function(e){e.preventDefault();});});\n  z.addEventListener('drop',function(e){e.preventDefault();var fs=Array.from((e.dataTransfer&&e.dataTransfer.files)||[]);if(fs.length)stAdd(fs);});\n})();\nasync function pagesAdd(S,files){\n  showBusy('फ़ाइलें खुल रही हैं…');\n  for(var fi=0;fi<files.length;fi++){\n    var f=files[fi];\n    try{\n      if(f.type==='application/pdf'||/\\.pdf$/i.test(f.name)){\n        var bytes=await readBytes(f);\n        var jd=await pdfjsLoadT(bytes); /* bytes सीधे worker को — कॉपी नहीं */\n        bytes=null;\n        var perms=null;try{perms=await jd.getPermissions();}catch(_){}\n        var color=S.colors[S.ci++ % S.colors.length];\n        var sid='s'+S.srcs.length;\n        /* jd/ld पकड़कर नहीं बैठते — सिर्फ़ File का पता रखते हैं, निर्यात पर दोबारा खोलेंगे */\n        S.srcs.push({id:sid,name:f.name,file:f,enc:(perms!==null),color:color});\n        if(perms!==null)toast('🔒 '+f.name+' लॉक है — सेव करते वक़्त पेज तस्वीर बनकर जुड़ेंगे','');\n        var n=jd.numPages;\n        for(var i=1;i<=n;i++){\n          setBusy(f.name+' — पेज '+i+'/'+n,(i/n)*100);\n          var thumb=await thumbForPdfPage(jd,i);\n          S.pages.push({uid:stUid(),type:'pdf',srcId:sid,idx:i-1,rot:0,baseThumb:thumb,thumb:thumb,color:color,sel:false});\n          if(i%4===0)await tick();\n        }\n        try{await jd.destroy();}catch(_){} /* थंबनेल बन गए — worker की मेमोरी छोड़ो */\n      }else if(/^image\\//.test(f.type)){\n        var ib=await readBytes(f);\n        var url=URL.createObjectURL(new Blob([ib],{type:f.type}));\n        var im=await loadImg(url);URL.revokeObjectURL(url);\n        var tc=document.createElement('canvas');\n        var sc=Math.min(1,180/im.width);\n        tc.width=Math.max(1,Math.round(im.width*sc));tc.height=Math.max(1,Math.round(im.height*sc));\n        tc.getContext('2d').drawImage(im,0,0,tc.width,tc.height);\n        var th=tc.toDataURL('image/jpeg',0.8);\n        var col2=S.colors[S.ci++ % S.colors.length];\n        S.pages.push({uid:stUid(),type:'img',name:f.name,bytes:ib,mime:f.type,iw:im.width,ih:im.height,rot:0,baseThumb:th,thumb:th,color:col2,sel:false});\n      }else{\n        toast('यह फ़ाइल नहीं चलेगी: '+f.name,'err');\n      }\n    }catch(err){toast(f.name+' — '+friendlyErr(err),'err');}\n    await tick();\n  }\n  hideBusy();\n}\nasync function stAdd(files){await pagesAdd(ST,files);stRender();}\nfunction pagesRender(S,gridSel,onChange,emptyHtml){\n  var g=$(gridSel);g.innerHTML='';\n  if(!S.pages.length){\n    g.innerHTML=emptyHtml;\n    return;\n  }\n  S.pages.forEach(function(p,ix){\n    var d=document.createElement('div');\n    d.className='pcard'+(p.sel?' sel':'');\n    d.dataset.uid=p.uid;\n    d.innerHTML='<div class=\"pchk\">✓<\/div><span class=\"srcdot\" style=\"background:'+p.color+'\"><\/span><span class=\"handle\" title=\"खींचकर क्रम बदलो\">⠿<\/span><div class=\"pimg\"><img src=\"'+p.thumb+'\" alt=\"\"><\/div><span class=\"pnum\">'+(ix+1)+'<\/span><div class=\"pacts\"><button class=\"pico rot\" title=\"घुमाओ\">↻<\/button><button class=\"pico dup\" title=\"कॉपी\">⧉<\/button><button class=\"pico del\" title=\"हटाओ\">✕<\/button><\/div>';\n    d.querySelector('.pchk').addEventListener('click',function(ev){ev.stopPropagation();p.sel=!p.sel;d.classList.toggle('sel',p.sel);});\n    d.querySelector('.pimg').addEventListener('click',function(){p.sel=!p.sel;d.classList.toggle('sel',p.sel);});\n    d.querySelector('.rot').addEventListener('click',async function(ev){\n      ev.stopPropagation();\n      p.rot=(p.rot+90)%360;\n      p.thumb=await rotateDataUrl(p.baseThumb,p.rot);\n      d.querySelector('.pimg img').src=p.thumb;\n    });\n    d.querySelector('.dup').addEventListener('click',function(ev){\n      ev.stopPropagation();\n      var cp=Object.assign({},p,{uid:stUid(),sel:false});\n      S.pages.splice(S.pages.indexOf(p)+1,0,cp);\n      onChange();\n    });\n    d.querySelector('.del').addEventListener('click',function(ev){\n      ev.stopPropagation();\n      S.pages.splice(S.pages.indexOf(p),1);\n      onChange();\n    });\n    g.appendChild(d);\n  });\n}\nvar ST_EMPTY='<div class=\"empty\">ऊपर “+ फ़ाइल जोड़ें” दबाओ या फ़ाइलें यहीं खींचकर छोड़ो — PDF और JPG/PNG दोनों चलेंगे।<\/div>';\nfunction stRender(){pagesRender(ST,'#st-grid',stRender,ST_EMPTY);}\nmakeSortable($('#st-grid'),'.pcard','.handle',true,function(){\n  var order=$$('#st-grid .pcard').map(function(el){return el.dataset.uid;});\n  ST.pages.sort(function(a,b){return order.indexOf(a.uid)-order.indexOf(b.uid);});\n  stRender();\n});\n$('#st-selall').addEventListener('click',function(){ST.pages.forEach(function(p){p.sel=true;});stRender();});\n$('#st-selnone').addEventListener('click',function(){ST.pages.forEach(function(p){p.sel=false;});stRender();});\n$('#st-rev').addEventListener('click',function(){ST.pages.reverse();stRender();});\n$('#st-delsel').addEventListener('click',function(){\n  if(!ST.pages.some(function(p){return p.sel;})){toast('पहले कुछ पेज चुनो');return;}\n  ST.pages=ST.pages.filter(function(p){return !p.sel;});\n  stRender();\n});\n$('#st-rotsel').addEventListener('click',async function(){\n  var sel=ST.pages.filter(function(p){return p.sel;});\n  if(!sel.length){toast('पहले कुछ पेज चुनो');return;}\n  for(var i=0;i<sel.length;i++){\n    sel[i].rot=(sel[i].rot+90)%360;\n    sel[i].thumb=await rotateDataUrl(sel[i].baseThumb,sel[i].rot);\n  }\n  stRender();\n});\n$('#st-zoom').addEventListener('input',function(e){document.documentElement.style.setProperty('--thw',e.target.value+'px');});\nasync function buildPagesPdf(srcs,list){\n    var out=await PDFDocument.create();\n    var jobs=list.map(function(p,pos){return {p:p,pos:pos};});\n    var bySrc={};\n    jobs.forEach(function(j){if(j.p.type==='pdf'){(bySrc[j.p.srcId]=bySrc[j.p.srcId]||[]).push(j);}});\n    var fixed=[];\n    for(var sid in bySrc){\n      var src=null;\n      for(var si=0;si<srcs.length;si++)if(srcs[si].id===sid)src=srcs[si];\n      var arr=bySrc[sid];\n      var directOk=false;\n      if(!src.enc){\n        try{\n          setBusy(src.name+' खुल रही है…');\n          var sb=await readBytes(src.file);\n          var ld=await libLoad(sb);\n          sb=null;\n          var copied=await out.copyPages(ld,arr.map(function(j){return j.p.idx;}));\n          arr.forEach(function(j,k){j.copied=copied[k];});\n          ld=null;copied=null; /* स्रोत छोड़ो */\n          directOk=true;\n        }catch(e){console.warn('सीधी कॉपी नहीं बनी, मरम्मत-मोड:',src.name,e);}\n      }\n      if(!directOk){\n        /* लॉक/बिगड़ी फ़ाइल: pdf.js से पेज तस्वीर बनाकर जोड़ेंगे */\n        fixed.push(src.name);\n        var rb=await readBytes(src.file);\n        var rjd=await pdfjsLoadT(rb);rb=null;\n        for(var ri=0;ri<arr.length;ri++){\n          var jj=arr[ri];\n          setBusy(src.name+' (मरम्मत) — पेज '+(ri+1)+'/'+arr.length);\n          var c=await renderPageCanvas(rjd,jj.p.idx+1,1.5);\n          var jb=await canvasBlob(c,'image/jpeg',0.85);\n          var emb=await out.embedJpg(await blobBytes(jb));\n          var pj=await rjd.getPage(jj.p.idx+1);\n          var vp1=pj.getViewport({scale:1});\n          jj.rast={emb:emb,w:vp1.width,h:vp1.height};\n          c.width=1;c.height=1;\n          await tick();\n        }\n        try{await rjd.destroy();}catch(_){}\n      }\n      await tick();\n    }\n    for(var i=0;i<jobs.length;i++){\n      var j=jobs[i];\n      setBusy('पेज '+(i+1)+'/'+jobs.length,((i+1)/jobs.length)*100);\n      if(j.p.type==='pdf'&&j.copied){\n        var pg=j.copied;\n        if(j.p.rot)pg.setRotation(degrees(normRot(pg.getRotation().angle+j.p.rot)));\n        out.addPage(pg);\n      }else if(j.p.type==='pdf'&&j.rast){\n        var pg3=out.addPage([j.rast.w,j.rast.h]);\n        pg3.drawImage(j.rast.emb,{x:0,y:0,width:j.rast.w,height:j.rast.h});\n        if(j.p.rot)pg3.setRotation(degrees(j.p.rot));\n      }else{\n        var bytes=j.p.bytes, iw=j.p.iw, ih=j.p.ih;\n        var isPng=/png/i.test(j.p.mime), isJpg=/jpe?g/i.test(j.p.mime);\n        if(!isPng&&!isJpg){\n          var conv=await imgBytesToJpeg(j.p.bytes,j.p.mime);\n          bytes=conv.bytes;iw=conv.w;ih=conv.h;isPng=false;\n        }\n        var emb=isPng?await out.embedPng(bytes):await out.embedJpg(bytes);\n        var maxPt=792,k=Math.min(1,maxPt/Math.max(iw,ih));\n        var pg2=out.addPage([iw*k,ih*k]);\n        pg2.drawImage(emb,{x:0,y:0,width:iw*k,height:ih*k});\n        if(j.p.rot)pg2.setRotation(degrees(j.p.rot));\n      }\n      if(i%10===0)await tick();\n    }\n    if(fixed.length)toast('🩹 मरम्मत से जुड़ीं: '+fixed.join(', '),'');\n    setBusy('अंतिम फ़ाइल लिखी जा रही है — बड़ी PDF में समय लगता है, रुको…',100);\n    await tick();\n    var outBytes=await out.save();\n    out=null;\n    return {bytes:outBytes,fixed:fixed,count:jobs.length};\n}\nasync function stExport(onlySel){\n  var list=onlySel?ST.pages.filter(function(p){return p.sel;}):ST.pages.slice();\n  if(!list.length){toast(onlySel?'कोई पेज चुना ही नहीं':'पहले कुछ फ़ाइलें जोड़ो','err');return;}\n  showBusy('PDF बन रही है…');\n  try{\n    var __r=await buildPagesPdf(ST.srcs,list);\n    var outBytes=__r.bytes, jobs={length:__r.count};\n    dl(new Blob([outBytes],{type:'application/pdf'}),saneName($('#st-name').value,'bodhi-document')+'.pdf');\n    toast('PDF तैयार — '+jobs.length+' पेज ('+fmtBytes(outBytes.length)+')','ok');\n  }catch(e){toast(friendlyErr(e),'err');}\n  hideBusy();\n}\n$('#st-saveall').addEventListener('click',function(){stExport(false);});\n$('#st-savesel').addEventListener('click',function(){stExport(true);});\n\n/* ================= 2. PDF जोड़ें ================= */\nvar MG={files:[]};\nbindDrop('#mg-drop','#mg-file',mgAdd);\nasync function mgAdd(fs){\n  showBusy('फ़ाइलें जाँची जा रही हैं…');\n  for(var i=0;i<fs.length;i++){\n    var f=fs[i];\n    if(!(f.type==='application/pdf'||/\\.pdf$/i.test(f.name))){toast(f.name+' PDF नहीं है','err');continue;}\n    setBusy(f.name,((i+1)/fs.length)*100);\n    try{\n      /* सिर्फ़ पेज-गिनती + लॉक-जाँच — पूरी फ़ाइल मेमोरी में पकड़कर नहीं बैठते */\n      var info=await probePdf(f);\n      MG.files.push({id:'m'+Math.random().toString(36).slice(2,8),name:f.name,file:f,pages:info.n,size:f.size,enc:info.enc});\n      if(info.enc)toast('🔒 '+f.name+' लॉक है — मरम्मत-मोड से जुड़ेगी','');\n    }catch(e){\n      var pw=/password/i.test(String((e&&e.message)||e));\n      if(pw){toast(f.name+' पासवर्ड माँगती है — पहले पासवर्ड हटाओ','err');}\n      else{\n        /* pdf.js भी न खोल पाए तो भी सूची में रखो — मरम्मत की आख़िरी कोशिश merge पर होगी */\n        MG.files.push({id:'m'+Math.random().toString(36).slice(2,8),name:f.name,file:f,pages:0,size:f.size,enc:false,broken:true});\n        toast('⚠ '+f.name+' ठीक से खुली नहीं — जोड़ते वक़्त मरम्मत की कोशिश होगी','');\n      }\n    }\n    await tick();\n  }\n  hideBusy();mgRender();\n}\nfunction mgRender(){\n  var L=$('#mg-list');L.innerHTML='';\n  MG.files.forEach(function(f,i){\n    var d=document.createElement('div');\n    d.className='frow';d.dataset.id=f.id;\n    var badge=f.enc?' <span title=\"लॉक PDF — मरम्मत से जुड़ेगी\">🔒<\/span>':(f.broken?' <span title=\"बिगड़ी PDF — मरम्मत की कोशिश होगी\">🩹<\/span>':'');\n    d.innerHTML='<span class=\"handle\">⠿<\/span><span class=\"ordn\">'+(i+1)+'<\/span><span class=\"fname\">'+esc(f.name)+badge+'<\/span><span class=\"fmeta\">'+(f.pages?f.pages+' पेज · ':'')+fmtBytes(f.size)+'<\/span><button class=\"pico del\" title=\"हटाओ\">✕<\/button>';\n    d.querySelector('.del').addEventListener('click',function(){MG.files.splice(MG.files.indexOf(f),1);mgRender();});\n    L.appendChild(d);\n  });\n  var acts=$('#mg-listacts');\n  if(MG.files.length){\n    acts.classList.remove('hidden');\n    var tot=MG.files.reduce(function(a,f){return a+f.size;},0);\n    var pg=MG.files.reduce(function(a,f){return a+f.pages;},0);\n    $('#mg-total').textContent='कुल: '+MG.files.length+' फ़ाइल · '+pg+' पेज · '+fmtBytes(tot);\n  }else acts.classList.add('hidden');\n}\n$('#mg-clear').addEventListener('click',function(){MG.files=[];mgRender();toast('सूची ख़ाली — मेमोरी भी छूट गई','ok');});\nmakeSortable($('#mg-list'),'.frow','.handle',false,function(){\n  var order=$$('#mg-list .frow').map(function(el){return el.dataset.id;});\n  MG.files.sort(function(a,b){return order.indexOf(a.id)-order.indexOf(b.id);});\n  mgRender();\n});\n/* एक फ़ाइल के सारे पेज out में जोड़ो — पहले सीधी कॉपी, न बने तो (मरम्मत-मोड on हो) rasterize */\nasync function mgAppendFile(out,f,doneBefore,total,allowFix){\n  if(f.enc||f.broken){\n    if(!allowFix)throw new Error(f.name+' लॉक/बिगड़ी है — मरम्मत-मोड (नीचे वाला ✓) चालू करो');\n    return await rasterizeAppend(out,f.file,f.name,doneBefore,total);\n  }\n  try{\n    var bytes=await readBytes(f.file);\n    var ld=await libLoad(bytes);\n    var ps=await out.copyPages(ld,ld.getPageIndices());\n    for(var i=0;i<ps.length;i++){\n      out.addPage(ps[i]);\n      if(i%25===0){setBusy(f.name+' — पेज '+(i+1)+'/'+ps.length,total?(((doneBefore+i+1)/total)*100):null);await tick();}\n    }\n    var k=ps.length;\n    ld=null;bytes=null;ps=null; /* स्रोत छोड़ो — अगली फ़ाइल के लिए मेमोरी ख़ाली */\n    return k;\n  }catch(e){\n    if(!allowFix)throw new Error(f.name+': '+String((e&&e.message)||e));\n    console.warn('सीधी कॉपी नहीं बनी, मरम्मत-मोड:',f.name,e);\n    return await rasterizeAppend(out,f.file,f.name,doneBefore,total);\n  }\n}\n$('#mg-go').addEventListener('click',async function(){\n  if(!MG.files.length){toast('पहले कम से कम 1 PDF डालो','err');return;}\n  var inter=$('#mg-inter').classList.contains('on');\n  if(inter&&MG.files.length!==2){toast('एकांतर के लिए ठीक 2 फ़ाइलें चाहिए','err');return;}\n  var allowFix=$('#mg-fix').checked;\n  var totSize=MG.files.reduce(function(a,f){return a+f.size;},0);\n  if(totSize>150*1048576)toast('⚠ '+fmtBytes(totSize)+' — बहुत बड़ा काम है, 1-3 मिनट लग सकते हैं; टैब बंद मत करना','');\n  showBusy('जोड़ा जा रहा है…');\n  try{\n    var out=await PDFDocument.create();\n    if(inter){\n      var A=MG.files[0],B=MG.files[1];\n      if(A.enc||A.broken||B.enc||B.broken)throw new Error('एकांतर सिर्फ़ ठीक-ठाक PDF पर चलता है — लॉक/बिगड़ी फ़ाइल पहले अकेले डालकर मरम्मत-कॉपी बना लो');\n      var ba=await readBytes(A.file), la=await libLoad(ba);\n      var pa=await out.copyPages(la,la.getPageIndices());\n      la=null;ba=null;\n      var bb=await readBytes(B.file), lb=await libLoad(bb);\n      var pb=await out.copyPages(lb,lb.getPageIndices());\n      lb=null;bb=null;\n      if($('#mg-rev').checked)pb.reverse();\n      var n=Math.max(pa.length,pb.length);\n      for(var i=0;i<n;i++){if(i<pa.length)out.addPage(pa[i]);if(i<pb.length)out.addPage(pb[i]);}\n    }else{\n      var done=0,total=MG.files.reduce(function(a,f){return a+f.pages;},0)||null;\n      var fixed=[];\n      for(var fi=0;fi<MG.files.length;fi++){\n        var f=MG.files[fi];\n        var before=(f.enc||f.broken);\n        var added=await mgAppendFile(out,f,done,total,allowFix);\n        if(before)fixed.push(f.name);\n        done+=added;\n        await tick();\n      }\n      if(fixed.length)toast('🩹 मरम्मत से जुड़ीं: '+fixed.join(', '),'');\n    }\n    setBusy('अंतिम फ़ाइल लिखी जा रही है — बड़ी PDF में समय लगता है, रुको…',100);\n    await tick();\n    var bytes=await out.save();\n    out=null;\n    dl(new Blob([bytes],{type:'application/pdf'}),saneName($('#mg-name').value,'bodhi-merged')+'.pdf');\n    toast('जुड़ गई — '+fmtBytes(bytes.length)+' की फ़ाइल डाउनलोड में आ गई','ok');\n  }catch(e){toast(friendlyErr(e),'err');}\n  hideBusy();\n});\n\n/* ================= 3. PDF तोड़ें ================= */\nvar SP={bytes:null,ld:null,jd:null,n:0,sel:new Set(),thumbsDone:false};\nbindDrop('#sp-drop','#sp-file',async function(fs){\n  var f=fs[0];\n  try{\n    showBusy('PDF खुल रही है…');\n    SP.bytes=await readBytes(f);\n    SP.ld=await libLoad(SP.bytes);\n    SP.jd=null; /* थंबनेल वाली कॉपी तभी बनेगी जब “चुनकर” टैब खोलोगे — बड़ी फ़ाइल में मेमोरी बचती है */\n    SP.n=SP.ld.getPageCount();\n    SP.sel=new Set();SP.thumbsDone=false;\n    $('#sp-grid').innerHTML='';\n    $('#sp-info').innerHTML='<span class=\"finfo-chip\">📄 '+esc(f.name)+'<\/span><span class=\"finfo-chip\"><b>'+SP.n+'<\/b> पेज<\/span><span class=\"finfo-chip\">'+fmtBytes(SP.bytes.length)+'<\/span>';\n    $('#sp-body').classList.remove('hidden');\n    hideBusy();\n    if(SP.ld.isEncrypted)toast('🔒 यह PDF लॉक है — टूटे हिस्सों में पेज ख़ाली आ सकते हैं। पक्का इलाज: “जोड़ो” टूल में अकेली डालकर मरम्मत-कॉपी बनाओ, फिर उसे तोड़ो।','err');\n    if($('#view-split .tab.on').dataset.t==='sp-pick')SP.ensureThumbs();\n  }catch(e){hideBusy();toast(friendlyErr(e),'err');}\n});\nSP.ensureThumbs=async function(){\n  if(SP.thumbsDone||!SP.bytes)return;\n  if(!SP.jd){showBusy('पेज खुल रहे हैं…');SP.jd=await pdfjsLoad(SP.bytes);}\n  SP.thumbsDone=true;\n  var g=$('#sp-grid');\n  var cap=Math.min(SP.n,300);\n  showBusy('पेज-थंबनेल बन रहे हैं…');\n  for(var i=1;i<=cap;i++){\n    setBusy('पेज '+i+'/'+cap,(i/cap)*100);\n    var t=await thumbForPdfPage(SP.jd,i);\n    (function(i){\n      var d=document.createElement('div');\n      d.className='pcard';\n      d.innerHTML='<div class=\"pchk\">✓<\/div><div class=\"pimg\"><img src=\"'+t+'\"><\/div><span class=\"pnum\">'+i+'<\/span>';\n      d.addEventListener('click',function(){\n        var ix=i-1;\n        if(SP.sel.has(ix)){SP.sel.delete(ix);d.classList.remove('sel');}\n        else{SP.sel.add(ix);d.classList.add('sel');}\n      });\n      d.dataset.i=i-1;\n      g.appendChild(d);\n    })(i);\n    if(i%8===0)await tick();\n  }\n  if(SP.n>cap)g.insertAdjacentHTML('beforeend','<div class=\"empty\" style=\"width:100%\">थंबनेल 300 पेज तक ही दिखते हैं — बाक़ी के लिए “रेंज से” वाला तरीका इस्तेमाल करो।<\/div>');\n  hideBusy();\n};\n$('#sp-pick-all').addEventListener('click',function(){$$('#sp-grid .pcard').forEach(function(d){SP.sel.add(+d.dataset.i);d.classList.add('sel');});});\n$('#sp-pick-none').addEventListener('click',function(){SP.sel.clear();$$('#sp-grid .pcard').forEach(function(d){d.classList.remove('sel');});});\nasync function makePdfFrom(indices){\n  var out=await PDFDocument.create();\n  var ps=await out.copyPages(SP.ld,indices);\n  ps.forEach(function(p){out.addPage(p);});\n  return out.save();\n}\n$('#sp-go').addEventListener('click',async function(){\n  if(!SP.ld){toast('पहले PDF डालो','err');return;}\n  var base=saneName($('#sp-name').value,'bodhi-split');\n  var active=$('#view-split .tab.on').dataset.t;\n  try{\n    if(active==='sp-range'){\n      var groups;\n      try{groups=parseRanges($('#sp-ranges').value,SP.n);}\n      catch(_){toast('रेंज समझ नहीं आई — ऐसे लिखो: 1-5, 8, 11-13','err');return;}\n      showBusy('तोड़ा जा रहा है…');\n      var mode=document.querySelector('input[name=\"sp-rm\"]:checked').value;\n      if(mode==='one'){\n        var flat=[];groups.forEach(function(g){flat=flat.concat(g);});\n        var b1=await makePdfFrom(flat);\n        dl(new Blob([b1],{type:'application/pdf'}),base+'.pdf');\n        toast('तैयार — '+flat.length+' पेज','ok');\n      }else{\n        var zip=new JSZip();\n        for(var i=0;i<groups.length;i++){\n          setBusy('हिस्सा '+(i+1)+'/'+groups.length,((i+1)/groups.length)*100);\n          zip.file(base+'-'+(i+1)+'.pdf',await makePdfFrom(groups[i]));\n        }\n        dl(await zip.generateAsync({type:'blob'}),base+'.zip');\n        toast(groups.length+' फ़ाइलें ZIP में तैयार','ok');\n      }\n    }else if(active==='sp-every'){\n      showBusy('तोड़ा जा रहा है…');\n      var nn=Math.max(1,parseInt($('#sp-n').value)||1);\n      var zip2=new JSZip();var part=0;\n      for(var s=0;s<SP.n;s+=nn){\n        part++;\n        var idx=[];for(var i2=s;i2<Math.min(s+nn,SP.n);i2++)idx.push(i2);\n        setBusy('हिस्सा '+part,(s/SP.n)*100);\n        zip2.file(base+'-'+part+'.pdf',await makePdfFrom(idx));\n        await tick();\n      }\n      dl(await zip2.generateAsync({type:'blob'}),base+'.zip');\n      toast(part+' फ़ाइलें ZIP में तैयार','ok');\n    }else if(active==='sp-single'){\n      showBusy('तोड़ा जा रहा है…');\n      var zip3=new JSZip();\n      for(var i3=0;i3<SP.n;i3++){\n        setBusy('पेज '+(i3+1)+'/'+SP.n,((i3+1)/SP.n)*100);\n        zip3.file(base+'-page-'+(i3+1)+'.pdf',await makePdfFrom([i3]));\n        if(i3%5===0)await tick();\n      }\n      dl(await zip3.generateAsync({type:'blob'}),base+'.zip');\n      toast(SP.n+' फ़ाइलें ZIP में','ok');\n    }else if(active==='sp-oe'){\n      showBusy('तोड़ा जा रहा है…');\n      var odd=[],even=[];\n      for(var i4=0;i4<SP.n;i4++)(i4%2===0?odd:even).push(i4);\n      var zip4=new JSZip();\n      zip4.file(base+'-odd.pdf',await makePdfFrom(odd));\n      if(even.length)zip4.file(base+'-even.pdf',await makePdfFrom(even));\n      dl(await zip4.generateAsync({type:'blob'}),base+'.zip');\n      toast('odd = विषम पेज (1,3,5…), even = सम पेज — ZIP तैयार','ok');\n    }else{\n      if(!SP.sel.size){toast('पहले पेज चुनो — थंबनेल पर टैप करो','err');return;}\n      showBusy('निकाला जा रहा है…');\n      var pick=Array.from(SP.sel).sort(function(a,b){return a-b;});\n      if($('#sp-rem').checked){\n        var rest=[];for(var i5=0;i5<SP.n;i5++)if(!SP.sel.has(i5))rest.push(i5);\n        var zip5=new JSZip();\n        zip5.file(base+'-chune.pdf',await makePdfFrom(pick));\n        if(rest.length)zip5.file(base+'-baaki.pdf',await makePdfFrom(rest));\n        dl(await zip5.generateAsync({type:'blob'}),base+'.zip');\n        toast('चुने + बाक़ी, दोनों फ़ाइलें ZIP में','ok');\n      }else{\n        var b2=await makePdfFrom(pick);\n        dl(new Blob([b2],{type:'application/pd t:-120px;animation:drift 26s ease-in-out infinite alternate}\n.orb.b{width:520px;height:520px;background:rgba(30,70,160,.22);bottom:-200px;left:-160px;animation:drift 34s ease-in-out infinite alternate-reverse}\n@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,40px) scale(1.12)}}\n@media (prefers-reduced-motion: reduce){\n  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}\n}\n\n/* ---------- header ---------- */\nheader{\n  position:sticky;top:0;z-index:50;\n  backdrop-filter:blur(14px);\n  background:rgba(8,15,36,.72);\n  border-bottom:1px solid rgba(216,178,74,.14);\n}\n.hwrap{max-width:1120px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}\n.diya{width:30px;height:30px;flex:0 0 auto}\n.brand{font-family:'Rozha One',serif;font-size:1.35rem;color:var(--gold);letter-spacing:.5px;line-height:1.2}\n.brand small{display:block;font-family:'Noto Sans Devanagari',sans-serif;font-size:.62rem;color:var(--muted);letter-spacing:2px;font-weight:600}\n.backbtn{margin-left:auto;display:none;align-items:center;gap:6px;background:transparent;border:1px solid var(--line);color:var(--gold);padding:7px 14px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:.85rem;transition:.2s}\n.backbtn:hover{background:var(--gold-soft)}\n.backbtn.show{display:inline-flex}\n.seam{height:2px;background:linear-gradient(90deg,transparent,var(--gold) 30%,#fff2c9 50%,var(--gold) 70%,transparent);background-size:200% 100%;animation:seam 6s linear infinite;opacity:.85}\n@keyframes seam{from{background-position:200% 0}to{background-position:-200% 0}}\n\n/* ---------- layout ---------- */\nmain{max-width:1120px;margin:0 auto;padding:22px 18px 70px;position:relative;z-index:1}\n.view{display:none}\n.view.active{display:block;animation:vin .35s ease both}\n@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\nh2.vt{font-family:'Rozha One',serif;color:var(--gold);font-size:1.5rem;font-weight:400;margin-bottom:2px}\np.vd{color:var(--muted);font-size:.88rem;margin-bottom:18px;max-width:640px}\n\n/* ---------- hero + home ---------- */\n.hero{text-align:center;padding:34px 8px 26px}\n.hero h1{font-family:'Rozha One',serif;font-weight:400;color:var(--ink);font-size:clamp(1.9rem,5.6vw,3.1rem);line-height:1.25}\n.hero h1 em{font-style:normal;color:var(--gold);position:relative;white-space:nowrap}\n.hero h1 em::after{content:\"\";position:absolute;left:2%;right:2%;bottom:2px;height:9px;background:linear-gradient(90deg,transparent,rgba(216,178,74,.45),transparent);border-radius:50%;filter:blur(1px)}\n.hero p{color:var(--muted);margin-top:10px;font-size:.95rem}\n.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}\n.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.76rem;padding:5px 13px;border-radius:999px}\n.chip b{color:var(--gold);font-weight:700}\n.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;margin-top:26px}\n.tcard{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:var(--r);padding:18px 15px 16px;cursor:pointer;transition:transform .22s,border-color .22s,box-shadow .22s,background .22s;animation:vin .5s ease both;position:relative;overflow:hidden}\n.tcard:nth-child(1){animation-delay:.02s}.tcard:nth-child(2){animation-delay:.06s}.tcard:nth-child(3){animation-delay:.1s}.tcard:nth-child(4){animation-delay:.14s}.tcard:nth-child(5){animation-delay:.18s}.tcard:nth-child(6){animation-delay:.22s}.tcard:nth-child(7){animation-delay:.26s}.tcard:nth-child(8){animation-delay:.3s}.tcard:nth-child(9){animation-delay:.34s}.tcard:nth-child(10){animation-delay:.38s}\n.tcard:hover{transform:translateY(-4px);border-color:var(--line);box-shadow:0 14px 38px rgba(216,178,74,.13);background:var(--card-2)}\n.tcard svg{width:32px;height:32px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:10px}\n.tcard h3{font-size:.98rem;color:var(--ink);font-weight:700;line-height:1.35}\n.tcard p{font-size:.74rem;color:var(--muted);margin-top:4px;line-height:1.5}\n.tcard .tag{position:absolute;top:10px;right:10px;font-size:.6rem;background:var(--gold);color:var(--navy-950);font-weight:700;padding:2px 8px;border-radius:999px}\n\n/* ---------- shared controls ---------- */\n.panel{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:var(--r);padding:16px}\n.panel + .panel{margin-top:14px}\n.panel h4{color:var(--gold);font-size:.86rem;font-weight:700;margin-bottom:10px;letter-spacing:.3px}\n.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}\n.row + .row{margin-top:10px}\nlabel.f{font-size:.8rem;color:var(--muted)}\ninput[type=text],input[type=number],select{\n  background:var(--navy-800);border:1px solid rgba(255,255,255,.14);color:var(--ink);\n  padding:8px 12px;border-radius:10px;font-family:inherit;font-size:.86rem;outline:none;transition:border .2s;\n}\ninput[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--gold)}\ninput[type=number]{width:88px}\ninput[type=range]{accent-color:var(--gold);cursor:pointer}\ninput[type=color]{width:40px;height:32px;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer;padding:2px}\ninput[type=checkbox],input[type=radio]{accent-color:var(--gold);width:16px;height:16px;cursor:pointer}\n.radio-line{display:flex;align-items:center;gap:7px;font-size:.85rem;cursor:pointer}\n.btn{\n  display:inline-flex;align-items:center;gap:7px;\n  background:linear-gradient(135deg,#E9C55E,#B8860B);color:var(--navy-950);\n  border:none;padding:10px 20px;border-radius:12px;font-family:inherit;font-weight:700;font-size:.9rem;cursor:pointer;\n  transition:transform .15s, box-shadow .2s, filter .2s;box-shadow:0 6px 18px rgba(216,178,74,.22);\n}\n.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}\n.btn:active{transform:translateY(0)}\n.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}\n.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--line);box-shadow:none}\n.btn.ghost:hover{background:var(--gold-soft)}\n.btn.small{padding:6px 13px;font-size:.78rem;border-radius:10px}\n.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(240,138,138,.4);box-shadow:none}\n.btn.danger:hover{background:rgba(240,138,138,.1)}\n\n.dropzone{\n  border:1.6px dashed var(--line);border-radius:var(--r);padding:30px 18px;text-align:center;cursor:pointer;\n  background:rgba(255,255,255,.02);transition:border-color .2s, background .25s, box-shadow .25s;\n}\n.dropzone svg{width:38px;height:38px;stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-bottom:8px;opacity:.9}\n.dropzone .dz1{font-weight:700;font-size:.95rem}\n.dropzone .dz2{font-size:.76rem;color:var(--muted);margin-top:3px}\n.dropzone.hover{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 4px rgba(216,178,74,.08),0 14px 40px rgba(216,178,74,.14)}\n\n.fileinfo{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}\n.finfo-chip{background:var(--navy-800);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:5px 13px;font-size:.76rem;color:var(--ink)}\n.finfo-chip b{color:var(--gold)}\n\n.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}\n.tab{background:transparent;border:1px solid rgba(255,255,255,.14);color:var(--muted);padding:7px 15px;border-radius:999px;font-family:inherit;font-size:.82rem;cursor:pointer;transition:.2s;font-weight:600}\n.tab.on{background:var(--gold);color:var(--navy-950);border-color:var(--gold);font-weight:700}\n.tabpane{display:none}\n.tabpane.on{display:block;animation:vin .25s ease both}\n.hint{font-size:.74rem;color:var(--muted);line-height:1.6}\n.hint.warn{color:#E8C77A}\n\n/* ---------- thumbnails / studio ---------- */\n.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:rgba(10,20,48,.85);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;position:sticky;top:64px;z-index:20;backdrop-filter:blur(10px);margin-bottom:14px}\n.toolbar .sep{width:1px;height:22px;background:rgba(255,255,255,.12)}\n.zoomwrap{display:flex;align-items:center;gap:6px;font-size:.74rem;color:var(--muted)}\n.pgrid{display:flex;flex-wrap:wrap;gap:12px;min-height:120px}\n.pcard{\n  width:var(--thw);background:var(--navy-800);border:1px solid rgba(255,255,255,.1);border-radius:12px;\n  padding:7px;position:relative;transition:transform .18s, border-color .18s, box-shadow .18s;animation:vin .3s ease both;\n}\n.pcard:hover{border-color:var(--line)}\n.pcard.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(216,178,74,.45)}\n.pcard.drag-src{opacity:.35}\n.pcard .pimg{width:100%;background:#0A1735;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}\n.pcard .pimg img{width:100%;height:auto;display:block}\n.pcard .pnum{position:absolute;left:10px;bottom:10px;background:rgba(7,14,34,.85);border:1px solid var(--line);color:var(--gold);font-size:.66rem;font-weight:700;padding:1px 7px;border-radius:999px}\n.pcard .srcdot{position:absolute;top:12px;left:12px;width:10px;height:10px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7)}\n.pcard .handle{position:absolute;top:8px;right:8px;background:rgba(7,14,34,.85);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:var(--muted);width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;font-size:.8rem;user-select:none}\n.pcard .handle:active{cursor:grabbing}\n.pacts{display:flex;justify-content:center;gap:5px;margin-top:6px}\n.pico{background:transparent;border:1px solid rgba(255,255,255,.16);color:var(--muted);width:26px;height:26px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.78rem;transition:.15
