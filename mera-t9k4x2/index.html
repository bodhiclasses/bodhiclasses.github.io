प जगमगाई जा रही है…');\n    try{\n      var rc=await wmReveal(WMDT.file);\n      var el2=$('#wm-dt-res');\n      el2.innerHTML='<b class=\"dtok\">छाया-चित्र तैयार<\/b> — जहाँ घना चमकता पाठ दिखे, वहीं छिपी छाप है (वॉटरमार्क मिटा हो तो भी):';\n      rc.style.maxWidth='100%';rc.style.borderRadius='8px';rc.style.marginTop='8px';rc.style.display='block';\n      el2.appendChild(rc);\n    }catch(e){toast(friendlyErr(e),'err');}\n    hideBusy();\n  });\n}\n$$('input[name=\"im-rs\"]').forEach(function(r){\n  r.addEventListener('change',function(){\n    var v=document.querySelector('input[name=\"im-rs\"]:checked').value;\n    $('#im-pctrow').style.display=(v==='pct')?'grid':'none';\n    $('#im-whrow').style.display=(v==='wh')?'flex':'none';\n    imEstimate();\n  });\n});\n$$('input[name=\"im-cm\"]').forEach(function(r){\n  r.addEventListener('change',function(){\n    var v=document.querySelector('input[name=\"im-cm\"]:checked').value;\n    $('#im-qrow').style.display=(v==='q')?'grid':'none';\n    $('#im-kbrow').style.display=(v==='kb')?'block':'none';\n    imEstimate();\n  });\n});\nbindOut('#im-pct','#o-impct','%',imEstimate);\nbindOut('#im-q','#o-imq','%',imEstimate);\nbindOut('#ip-q','#o-ipq','%',null);\n$$('.preset').forEach(function(b){b.addEventListener('click',function(){$('#im-kb').value=b.dataset.kb;});});\n$('#im-fmt').addEventListener('change',imEstimate);\n$('#im-w').addEventListener('input',imEstimate);\n$('#im-h').addEventListener('input',imEstimate);\nbindOut('#sc-br','#o-scbr','',function(){SC.br=+$('#sc-br').value;scDrawDeb();});\nbindOut('#sc-ct','#o-scct','',function(){SC.ct=+$('#sc-ct').value;scDrawDeb();});\nif(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){wmDrawOverlay();});}\n<\/script>\n<\/body>\n<\/html>\n","pinned":true,"uses":0,"createdAt":1788625090520,"updatedAt":1788625090520,"history":[],"seedRev":0},{"id":"prompt_lower_pcs_50q_v1","type":"prompt","name":"UPSSSC Lower PCS — 50 प्रश्न MCQ प्रॉम्प्ट","cat":"mcq","notes":"Lower PCS Prelims स्तर के 50 द्विभाषी, मुख्यतः सीधे तथ्यात्मक MCQ बनवाने के लिए; उत्तर और व्याख्या हर प्रश्न के नीचे।","content":"You are an expert question setter for the UPSSSC / Lower-PCS (Lower Subordinate) exam. Study all source material in this notebook deeply and create 50 original, quality MCQs at Lower-PCS Prelims level. Output clean Markdown, saveable as a .md file.\n\nFORMAT — every question exactly this, nothing added:\n\nप्रश्न 1: [Hindi] / Question 1: [English]\n(A) [Hindi] / [English]\n(B) [Hindi] / [English]\n(C) [Hindi] / [English]\n(D) [Hindi] / [English]\nउत्तर: (letter) [Hindi] / Answer: (letter) [English]\nव्याख्या: [Hindi, 1–2 lines] / Explanation: [English, 1–2 lines]\n\nOne blank line between questions. Numbering unbroken 1...50, English numerals only. Put the English on the SAME line after \" / \" — never open a new line with \"Question X:\" or an English option. Each option on its own line; never two on one line.\n\nDIVIDER RULE — the spaced \" / \" is reserved: exactly ONE per line, only to separate Hindi from English. Never use a spaced \" / \" anywhere inside the Hindi or English text itself — for alternatives write \"अथवा\"/\"or\", use commas, or an unspaced slash (किमी/घंटा). The English half of the question line must always begin with \"Question N:\".\n\nRULES\n\nBilingual — question, all four options, answer and explanation in both Hindi and English.\n\nQuestion mix — the large majority (about 40 or more) must be direct one-liner factual MCQs: one clean fact asked plainly. The remaining few may ONLY be simple two-statement questions — \"निम्नलिखित कथनों पर विचार करें: कथन 1: ... कथन 2: ...\" with options केवल 1 / केवल 2 / दोनों / कोई नहीं. Keep कथन 1 and कथन 2 inside the question line, never on lines starting with प्रश्न. No other type at all — no assertion–reason, no matching, no three-or-more-statement questions.\n\nIn the two-statement questions the answer must VARY across the set — sometimes only 1, sometimes only 2, sometimes both. Never let \"दोनों/Both\" become the standard answer.\n\nExplanations 1–2 lines, sharp and fact-first: give the correct fact directly and, where useful, why the main wrong option is wrong. No vague or preachy lines. NEVER write \"according to the document/source\" or hint at any source — write every fact as a subject expert's own knowledge.\n\nAnswer key genuinely random — A/B/C/D unpredictable, each roughly 11–14 times, no cyclic pattern, never 3+ in a row, and the correct option must not consistently be the longest.\n\nLevel = Lower-PCS: clear and factual, a shade easier than State PCS but never trivial. Give 2–3 believable wrong options so a weak student still feels real confusion.\n\nOnly stable facts and concepts — skip anything that changes yearly (budget, latest data, rankings).\n\nBuild only from text you can read clearly. No two questions test the same fact. Don't move top-to-bottom through the sources — pull from beginning, middle and end so topics and order feel random.\n\nFORBIDDEN: any Answer Key / उत्तर कुंजी / उत्तरमाला list or table at the end (every answer stays under its own question); any Markdown table; any ---, ***, bold, or heading. No intro or closing line — start at \"प्रश्न 1:\", end on the last explanation.\n\nBefore answering, silently self-check: numbering unbroken; every question has 4 options + one उत्तर line + one व्याख्या line; only ONE spaced \" / \" per line; only one-liners and simple two-statement questions present; no forbidden symbols or answer-key list; output starts at प्रश्न 1 and ends on the last explanation. Fix quietly, then output only the 50 questions.","pinned":true,"uses":0,"createdAt":1783683154377,"updatedAt":1783683154377,"history":[],"seedRev":1},{"id":"prompt_uppcs_50q_v1","type":"prompt","name":"UPPCS — 50 प्रश्न MCQ प्रॉम्प्ट","cat":"mcq","notes":"UPPCS Prelims के 50 कठिन द्विभाषी MCQ बनवाने के लिए; direct, statement, match-list और chronology का नियंत्रित मिश्रण।","content":"You are an expert UPPCS/State-PCS question setter. Study all source material in this notebook deeply and create 50 original, high-quality MCQs at PCS Prelims level. Output clean Markdown, saveable as a .md file.\n\nFORMAT — every question exactly this, nothing added:\n\nप्रश्न 1: [Hindi] / Question 1: [English]\n(A) [Hindi] / [English]\n(B) [Hindi] / [English]\n(C) [Hindi] / [English]\n(D) [Hindi] / [English]\nउत्तर: (letter) [Hindi] / Answer: (letter) [English]\nव्याख्या: [Hindi, 1–2 lines] / Explanation: [English, 1–2 lines]\n\nOne blank line between questions. Numbering unbroken 1...50, English numerals only. Put the English on the SAME line after \" / \" — never open a new line with \"Question X:\" or an English option. Each option on its own line; never two on one line.\n\nDIVIDER RULE — the spaced \" / \" is reserved: exactly ONE per line, only to separate Hindi from English. Never use a spaced \" / \" anywhere inside the Hindi or English text itself — for alternatives write \"अथवा\"/\"or\", use commas, or an unspaced slash (किमी/घंटा). The English half of the question line must always begin with \"Question N:\".\n\nRULES\n\nBilingual — question, all four options, answer and explanation in both Hindi and English.\n\nQuestion mix — about 30 direct single-fact MCQs; 8–10 two-statement questions (\"निम्नलिखित कथनों पर विचार करें: कथन 1: ... कथन 2: ...\" — कथन stays inside the question line; options केवल 1 / केवल 2 / दोनों / कोई नहीं; VARY the correct answer, never let \"दोनों/Both\" become standard); 5–6 match-the-list questions (inside the question line write \"सूची-I: A. ..., B. ..., C. ...; सूची-II: 1. ..., 2. ..., 3. ...\" — items separated by commas and semicolons only, options like \"A-2, B-3, C-1\"); 4–5 chronology or correct-pairs questions (\"कालक्रम में व्यवस्थित कीजिए: 1. ..., 2. ..., 3. ...\" with order options, or \"उपर्युक्त युग्मों में से कितने सही सुमेलित हैं\" with pairs listed in the question line). No assertion–reason, no four-or-more-statement questions.\n\nExplanations 1–2 lines, sharp and fact-first: give the correct fact directly and, where useful, why the main wrong option is wrong. No vague or preachy lines. NEVER write \"according to the document/source\" or hint at any source — write every fact as a subject expert's own knowledge.\n\nAnswer key genuinely random — A/B/C/D unpredictable, each roughly 11–14 times, no cyclic pattern, never 3+ in a row, and the correct option must not consistently be the longest.\n\nLevel = true UPPCS Prelims, tilted tough: at least 80% of the questions must be moderate-to-hard — near-miss distractors, commonly-confused pairs, exception-based traps — so even a well-prepared student feels genuine doubt. At most 20% may be basic direct-recall. Never trivial, never a copied textbook line.\n\nOnly stable facts and concepts — skip anything that changes yearly (budget, latest data, rankings) so the test never dates.\n\nBuild only from text you can read clearly. No two questions test the same fact. Don't move top-to-bottom through the sources — pull from beginning, middle and end so topics and order feel random.\n\nFORBIDDEN: any Answer Key / उत्तर कुंजी / उत्तरमाला list or table at the end (every answer stays under its own question); any Markdown table; any ---, ***, bold, or heading. No intro or closing line — start at \"प्रश्न 1:\", end on the last explanation.\n\nBefore answering, silently self-check: numbering unbroken; every question has 4 options + one उत्तर line + one व्याख्या line; only ONE spaced \" / \" per line; question-type counts match the mix above; difficulty split roughly 80/20 as instructed; no forbidden symbols or answer-key list; output starts at प्रश्न 1 and ends on the last explanation. Fix quietly, then output only the 50 questions.","pinned":true,"uses":0,"createdAt":1783683154378,"updatedAt":1783683154378,"history":[],"seedRev":1},{"id":"app_bodhi_link_dashboard_v3","type":"app","name":"बोधि — लिंक डैशबोर्ड v3","cat":"apps","notes":"GitHub repo में फ़ाइल (test HTML, PDF, notes) upload करके permanent share-link बनाने का डैशबोर्ड — token/profile एक बार सेट, फिर फ़ोल्डर चुनो, फ़ाइल डालो, लिंक कॉपी।","content":"<!DOCTYPE html>\n<html lang=\"hi\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>बोधि लिंक डैशबोर्ड<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Rozha+One&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --navy:#0a1322; --navy2:#0f1c33; --card:#142440; --card2:#182b4d;\n  --line:#263b60; --gold:#d9b45b; --gold2:#f0d48a; --gold-dim:#8a7440;\n  --text:#eaf0fa; --muted:#96a7c6; --ok:#5fdc93; --err:#ff8f8f; --warn:#ffd27a;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml{-webkit-text-size-adjust:100%}\nbody{\n  background:\n    radial-gradient(900px 480px at 85% -10%, #1a2f55 0%, transparent 60%),\n    radial-gradient(700px 400px at -10% 110%, #122343 0%, transparent 55%),\n    var(--navy);\n  color:var(--text);\n  font-family:'Noto Sans Devanagari','Hind',system-ui,sans-serif;\n  min-height:100vh; padding:14px 12px 60px;\n}\n.wrap{max-width:780px;margin:0 auto}\nheader{padding:14px 4px 18px;border-bottom:1px solid var(--line);margin-bottom:16px}\nh1{font-family:'Rozha One',serif;font-weight:400;color:var(--gold);font-size:1.7rem;letter-spacing:.3px;line-height:1.25}\n.sub{color:var(--muted);font-size:.86rem;margin-top:4px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}\n.card h2{font-size:.8rem;color:var(--gold);letter-spacing:.14em;font-weight:700;margin-bottom:10px;text-transform:uppercase}\nbutton{font-family:inherit;border:none;border-radius:10px;cursor:pointer;font-size:.92rem}\n.btn{background:var(--gold);color:#1b1607;font-weight:700;padding:11px 18px}\n.btn:active{transform:scale(.98)}\n.btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--gold-dim);font-weight:500}\n.btn.mini{padding:7px 12px;font-size:.82rem;border-radius:8px}\n.btn.danger{background:transparent;border:1px solid #6b3a3a;color:var(--err)}\n.btn:disabled{opacity:.45;cursor:not-allowed}\ninput,select{\n  width:100%;background:var(--navy2);border:1px solid var(--line);color:var(--text);\n  border-radius:10px;padding:11px 12px;font-family:inherit;font-size:.95rem;margin-bottom:10px\n}\ninput:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}\nlabel{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}\n.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}\n.chips{display:flex;gap:8px;flex-wrap:wrap}\n.chip{\n  background:var(--navy2);border:1px solid var(--line);color:var(--text);\n  padding:9px 14px;border-radius:999px;font-size:.88rem\n}\n.chip.on{background:var(--gold);color:#1b1607;font-weight:700;border-color:var(--gold)}\n.chip.folder{border-style:dashed;border-color:var(--gold-dim);color:var(--gold2)}\n.crumb{font-size:.86rem;color:var(--muted);margin-bottom:10px;word-break:break-all}\n.crumb b{color:var(--gold2);font-weight:500}\n.filerow{\n  display:flex;justify-content:space-between;align-items:center;gap:8px;\n  padding:9px 4px;border-bottom:1px dashed var(--line);font-size:.88rem\n}\n.filerow:last-child{border-bottom:none}\n.filerow .nm{word-break:break-all;color:var(--text)}\n.drop{\n  border:2px dashed var(--gold-dim);border-radius:14px;padding:26px 14px;text-align:center;\n  color:var(--muted);background:var(--navy2);transition:border-color .2s, background .2s\n}\n.drop.over{border-color:var(--gold);background:var(--card2)}\n.drop .big{font-size:1.02rem;color:var(--gold2);margin-bottom:4px}\n.ticket{\n  border:1px solid var(--gold-dim);border-left:4px solid var(--gold);\n  background:linear-gradient(180deg,var(--card2),var(--card));\n  border-radius:12px;padding:12px;margin-top:10px\n}\n.ticket .fn{font-weight:700;font-size:.92rem;word-break:break-all}\n.ticket .url{\n  font-size:.78rem;color:var(--gold2);word-break:break-all;margin:7px 0 10px;\n  background:var(--navy);padding:8px 10px;border-radius:8px;border:1px solid var(--line)\n}\n.st-ok{color:var(--ok)} .st-err{color:var(--err)} .st-wait{color:var(--warn)}\n.note{font-size:.8rem;color:var(--muted);margin-top:8px;line-height:1.6}\ndetails{margin-bottom:12px}\nsummary{\n  cursor:pointer;color:var(--gold2);font-size:.9rem;padding:11px 14px;\n  background:var(--card);border:1px solid var(--line);border-radius:12px;list-style:none\n}\nsummary::-webkit-details-marker{display:none}\nsummary::before{content:\"❖ \";color:var(--gold)}\ndetails[open] summary{border-radius:12px 12px 0 0}\n.guide{\n  background:var(--card);border:1px solid var(--line);border-top:none;\n  border-radius:0 0 12px 12px;padding:14px;font-size:.88rem;line-height:1.85;color:var(--text)\n}\n.guide b{color:var(--gold2)}\n.guide ol{padding-right:18px;margin:6px 0}\n.guide li{margin-bottom:6px}\n.tag{font-size:.72rem;background:var(--navy2);border:1px solid var(--line);padding:2px 8px;border-radius:6px;color:var(--muted)}\n.hide{display:none !important}\n.spin{display:inline-block;animation:sp 1s linear infinite}\n@keyframes sp{to{transform:rotate(360deg)}}\n@media (prefers-reduced-motion:reduce){.spin{animation:none}}\n.toast{\n  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);\n  background:var(--gold);color:#1b1607;font-weight:700;padding:10px 18px;\n  border-radius:999px;font-size:.88rem;box-shadow:0 6px 24px rgba(0,0,0,.5);z-index:99\n}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<header>\n  <h1>बोधि लिंक डैशबोर्ड<\/h1>\n  <div class=\"sub\">फ़ाइल डालो → गिटहब पेजेस पर सीधा लिंक पाओ। कोई महीने की लिमिट नहीं।<\/div>\n<\/header>\n\n<details id=\"guideBox\">\n  <summary>सेटअप गाइड — पहली बार सिर्फ़ 5 मिनट<\/summary>\n  <div class=\"guide\">\n    <b>चरण 1 — रिपो बनाओ (एक बार)<\/b>\n    <ol>\n      <li>गिटहब पर लॉगिन → नई रिपॉज़िटरी बनाओ, नाम जैसे <b>bodhi-tests<\/b><\/li>\n      <li><b>Public<\/b> रखो और <b>Add a README file<\/b> पर टिक लगाओ → Create<\/li>\n    <\/ol>\n    <b>चरण 2 — पेजेस चालू करो (एक बार)<\/b>\n    <ol>\n      <li>रिपो के अंदर <b>Settings → Pages<\/b><\/li>\n      <li>Source: <b>Deploy from a branch<\/b>, Branch: <b>main<\/b>, फ़ोल्डर <b>/ (root)<\/b> → Save<\/li>\n    <\/ol>\n    <b>चरण 3 — टोकन बनाओ (एक बार)<\/b>\n    <ol>\n      <li>गिटहब प्रोफ़ाइल फ़ोटो → <b>Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token<\/b><\/li>\n      <li>Expiration में लंबी अवधि चुनो (जैसे 1 साल)<\/li>\n      <li>Repository access: <b>Only select repositories<\/b> → अपनी वही रिपो चुनो<\/li>\n      <li>Permissions → Repository permissions → <b>Contents: Read and write<\/b><\/li>\n      <li>Generate दबाओ और टोकन (ghp/github_pat से शुरू होने वाला कोड) कॉपी कर लो<\/li>\n    <\/ol>\n    <b>चरण 4 — नीचे प्रोफ़ाइल में यूज़रनेम, रिपो और टोकन भर दो। बस, रोज़ का काम अब सिर्फ़ 10 सेकंड का है।<\/b>\n    <div class=\"note\">टोकन सिर्फ़ इसी ब्राउज़र में सेव होता है — फ़ाइल के अंदर नहीं। जय हो स्टडी के लिए दूसरी रिपो/खाते की अलग प्रोफ़ाइल जोड़ लो।<\/div>\n  <\/div>\n<\/details>\n\n<div class=\"card\">\n  <h2>प्रोफ़ाइल<\/h2>\n  <div class=\"chips\" id=\"profChips\"><\/div>\n  <div id=\"profForm\" class=\"hide\" style=\"margin-top:12px\">\n    <label>प्रोफ़ाइल का नाम<\/label>\n    <input id=\"pName\" placeholder=\"जैसे: बोधि क्लासेस\">\n    <label>गिटहब यूज़रनेम<\/label>\n    <input id=\"pUser\" placeholder=\"जैसे: adityachauhan\" autocapitalize=\"off\" autocorrect=\"off\">\n    <label>रिपो का नाम<\/label>\n    <input id=\"pRepo\" placeholder=\"जैसे: bodhi-tests\" autocapitalize=\"off\" autocorrect=\"off\">\n    <label>ब्रांच<\/label>\n    <input id=\"pBranch\" value=\"main\" autocapitalize=\"off\">\n    <label>टोकन (Fine-grained, Contents: Read and write)<\/label>\n    <input id=\"pToken\" type=\"password\" placeholder=\"github_pat_...\" autocapitalize=\"off\" autocorrect=\"off\">\n    <div class=\"row\">\n      <button class=\"btn\" id=\"saveProf\">प्रोफ़ाइल सेव करो<\/button>\n      <button class=\"btn ghost\" id=\"cancelProf\">रद्द<\/button>\n    <\/div>\n  <\/div>\n  <div class=\"row\" style=\"margin-top:10px\" id=\"profActions\">\n    <button class=\"btn ghost mini\" id=\"addProf\">+ नई प्रोफ़ाइल<\/button>\n    <button class=\"btn danger mini hide\" id=\"delProf\">यह प्रोफ़ाइल हटाओ<\/button>\n  <\/div>\n<\/div>\n\n<div class=\"card hide\" id=\"browserCard\">\n  <h2>फ़ोल्डर चुनो<\/h2>\n  <div class=\"crumb\" id=\"crumb\"><\/div>\n  <div class=\"chips\" id=\"dirChips\" style=\"margin-bottom:12px\"><\/div>\n  <div class=\"row\">\n    <input id=\"newDir\" placeholder=\"नया फ़ोल्डर — जैसे: uppcs-2026\" style=\"flex:1;min-width:150px;margin-bottom:0\" autocapitalize=\"off\" autocorrect=\"off\">\n    <button class=\"btn ghost mini\" id=\"mkDir\">खोलो / बनाओ<\/button>\n  <\/div>\n  <div id=\"fileList\" style=\"margin-top:12px\"><\/div>\n<\/div>\n\n<div class=\"card hide\" id=\"uploadCard\">\n  <h2>फ़ाइल अपलोड<\/h2>\n  <div class=\"drop\" id=\"drop\">\n    <div class=\"big\">यहाँ टैप करके फ़ाइल चुनो<\/div>\n    <div>या फ़ाइलें खींचकर छोड़ दो (HTML, PDF — कुछ भी)<\/div>\n    <input type=\"file\" id=\"fileInput\" multiple class=\"hide\">\n  <\/div>\n  <div class=\"note\" style=\"margin-top:10px\">फ़ाइल चुनते ही नाम अपने आप छोटा हो जाएगा। पसंद न आए तो बदल लो, वरना सीधे अपलोड दबाओ।<\/div>\n  <div id=\"results\"><\/div>\n  <div class=\"note hide\" id=\"liveNote\">नया लिंक 30–60 सेकंड में लाइव होता है (गिटहब पेजेस बिल्ड)। पुरानी फ़ाइल दोबारा डालोगे तो वही लिंक अपडेट हो जाएगा।<\/div>\n<\/div>\n\n<\/div>\n\n<script>\n(function(){\n\"use strict\";\nvar LS_KEY=\"bodhi_link_dash_v1\";\nvar mem=null;\nvar curFiles=[];\nvar store={\n  get:function(){ try{ var v=localStorage.getItem(LS_KEY); return v?JSON.parse(v):mem; }catch(e){ return mem; } },\n  set:function(v){ mem=v; try{ localStorage.setItem(LS_KEY,JSON.stringify(v)); }catch(e){} }\n};\nvar state=store.get()||{profiles:[],active:null,path:\"\"};\nif(!state.profiles) state.profiles=[];\nif(typeof state.path!==\"string\") state.path=\"\";\n\nfunction $(id){ return document.getElementById(id); }\nfunction save(){ store.set(state); }\nfunction prof(){ for(var i=0;i<state.profiles.length;i++){ if(state.profiles[i].id===state.active) return state.profiles[i]; } return null; }\nfunction esc(s){ return String(s).replace(/[&<>\"']/g,function(c){return{\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",\"\\\"\":\"&quot;\",\"'\":\"&#39;\"}[c];}); }\nfunction encPath(p){ return p.split(\"/\").filter(Boolean).map(encodeURIComponent).join(\"/\"); }\n\nfunction toast(msg){\n  var t=document.createElement(\"div\"); t.className=\"toast\"; t.textContent=msg;\n  document.body.appendChild(t); setTimeout(function(){ t.remove(); },1800);\n}\nfunction copyText(txt){\n  if(navigator.clipboard && navigator.clipboard.writeText){\n    navigator.clipboard.writeText(txt).then(function(){toast(\"लिंक कॉपी हो गया\");},function(){fallbackCopy(txt);});\n  } else fallbackCopy(txt);\n}\nfunction fallbackCopy(txt){\n  var ta=document.createElement(\"textarea\"); ta.value=txt; document.body.appendChild(ta);\n  ta.select(); try{ document.execCommand(\"copy\"); toast(\"लिंक कॉपी हो गया\"); }catch(e){ toast(\"कॉपी नहीं हो पाया\"); }\n  ta.remove();\n}\n\nfunction api(path,opts){\n  opts=opts||{};\n  var p=prof();\n  var h={ \"Authorization\":\"Bearer \"+p.token, \"Accept\":\"application/vnd.github+json\", \"X-GitHub-Api-Version\":\"2022-11-28\" };\n  if(opts.headers){ for(var k in opts.headers) h[k]=opts.headers[k]; }\n  opts.headers=h;\n  return fetch(\"https://api.github.com/repos/\"+encodeURIComponent(p.user)+\"/\"+encodeURIComponent(p.repo)+\"/\"+path,opts);\n}\nfunction pagesUrl(fullPath){\n  var p=prof();\n  var base = p.repo.toLowerCase()===(p.user.toLowerCase()+\".github.io\")\n    ? \"https://\"+p.user+\".github.io\"\n    : \"https://\"+p.user+\".github.io/\"+p.repo;\n  return base+\"/\"+encPath(fullPath);\n}\n\n/* ---------- प्रोफ़ाइल UI ---------- */\nfunction renderProfiles(){\n  var box=$(\"profChips\"); box.innerHTML=\"\";\n  state.profiles.forEach(function(p){\n    var c=document.createElement(\"button\");\n    c.className=\"chip\"+(p.id===state.active?\" on\":\"\");\n    c.textContent=p.name;\n    c.onclick=function(){ state.active=p.id; state.path=\"\"; save(); renderAll(); refresh(); };\n    box.appendChild(c);\n  });\n  if(!state.profiles.length){\n    var s=document.createElement(\"span\"); s.className=\"tag\";\n    s.textContent=\"अभी कोई प्रोफ़ाइल नहीं — ऊपर गाइड देखो, फिर + नई प्रोफ़ाइल\";\n    box.appendChild(s);\n    $(\"guideBox\").open=true;\n  }\n  $(\"delProf\").classList.toggle(\"hide\", !prof());\n}\nfunction renderAll(){\n  renderProfiles();\n  var has=!!prof();\n  $(\"browserCard\").classList.toggle(\"hide\",!has);\n  $(\"uploadCard\").classList.toggle(\"hide\",!has);\n}\n$(\"addProf\").onclick=function(){ $(\"profForm\").classList.remove(\"hide\"); };\n$(\"cancelProf\").onclick=function(){ $(\"profForm\").classList.add(\"hide\"); };\n$(\"saveProf\").onclick=function(){\n  var name=$(\"pName\").value.trim(), user=$(\"pUser\").value.trim(),\n      repo=$(\"pRepo\").value.trim(), br=$(\"pBranch\").value.trim()||\"main\",\n      tok=$(\"pToken\").value.trim();\n  if(!name||!user||!repo||!tok){ toast(\"सारे खाने भरो\"); return; }\n  var p={id:String(Date.now()),name:name,user:user,repo:repo,branch:br,token:tok};\n  state.profiles.push(p); state.active=p.id; state.path=\"\"; save();\n  $(\"pName\").value=$(\"pUser\").value=$(\"pRepo\").value=$(\"pToken\").value=\"\"; $(\"pBranch\").value=\"main\";\n  $(\"profForm\").classList.add(\"hide\");\n  renderAll(); refresh();\n};\n$(\"delProf\").onclick=function(){\n  var p=prof(); if(!p) return;\n  if(!confirm(\"प्रोफ़ाइल \\\"\"+p.name+\"\\\" हटा दें? (रिपो की फ़ाइलें सुरक्षित रहेंगी)\")) return;\n  state.profiles=state.profiles.filter(function(x){return x.id!==p.id;});\n  state.active=state.profiles.length?state.profiles[0].id:null; state.path=\"\"; save();\n  renderAll(); if(prof()) refresh();\n};\n\n/* ---------- फ़ोल्डर ब्राउज़र ---------- */\nfunction crumbHTML(){\n  var parts=state.path.split(\"/\").filter(Boolean);\n  var html='<b data-p=\"\">🏠 होम<\/b>';\n  var acc=\"\";\n  parts.forEach(function(seg){ acc+=(acc?\"/\":\"\")+seg; html+=' / <b data-p=\"'+esc(acc)+'\">'+esc(seg)+\"<\/b>\"; });\n  return html;\n}\nfunction refresh(){\n  var p=prof(); if(!p) return;\n  $(\"crumb\").innerHTML=crumbHTML();\n  Array.prototype.forEach.call($(\"crumb\").querySelectorAll(\"b\"),function(b){\n    b.style.cursor=\"pointer\";\n    b.onclick=function(){ state.path=b.getAttribute(\"data-p\"); save(); refresh(); };\n  });\n  $(\"dirChips\").innerHTML='<span class=\"tag\"><span class=\"spin\">◌<\/span> लोड हो रहा…<\/span>';\n  $(\"fileList\").innerHTML=\"\";\n  api(\"contents/\"+encPath(state.path)+\"?ref=\"+encodeURIComponent(p.branch))\n  .then(function(r){\n    if(r.status===404) return {notfound:true};\n    if(r.status===401||r.status===403) throw new Error(\"टोकन गलत है या अनुमति नहीं — प्रोफ़ाइल जाँचो\");\n    if(!r.ok) throw new Error(\"त्रुटि \"+r.status);\n    return r.json();\n  })\n  .then(function(j){\n    var chips=$(\"dirChips\"); chips.innerHTML=\"\";\n    if(state.path){\n      var up=document.createElement(\"button\"); up.className=\"chip\"; up.textContent=\"⬆ ऊपर\";\n      up.onclick=function(){ var a=state.path.split(\"/\"); a.pop(); state.path=a.join(\"/\"); save(); refresh(); };\n      chips.appendChild(up);\n    }\n    if(j&&j.notfound){\n      var s=document.createElement(\"span\"); s.className=\"tag\";\n      s.textContent=state.path?\"यह फ़ोल्डर अभी खाली है — पहली फ़ाइल डालते ही बन जाएगा\":\"रिपो खाली है या नाम गलत — पहली फ़ाइल डालकर देखो\";\n      chips.appendChild(s); return;\n    }\n    var items=Array.isArray(j)?j:[j];\n    var dirs=items.filter(function(x){return x.type===\"dir\";});\n    var files=items.filter(function(x){return x.type===\"file\"&&x.name.toLowerCase()!==\"readme.md\";});\n    curFiles=files.map(function(x){return x.name.toLowerCase();});\n    dirs.forEach(function(d){\n      var c=document.createElement(\"button\"); c.className=\"chip folder\"; c.textContent=\"📁 \"+d.name;\n      c.onclick=function(){ state.path=(state.path?state.path+\"/\":\"\")+d.name; save(); refresh(); };\n      chips.appendChild(c);\n    });\n    if(!dirs.length&&!state.path){\n      var t=document.createElement(\"span\"); t.className=\"tag\"; t.textContent=\"कोई फ़ोल्डर नहीं — नीचे नया बना लो\";\n      chips.appendChild(t);\n    }\n    var fl=$(\"fileList\"); fl.innerHTML=\"\";\n    files.forEach(function(f){\n      var url=pagesUrl((state.path?state.path+\"/\":\"\")+f.name);\n      var row=document.createElement(\"div\"); row.className=\"filerow\";\n      row.innerHTML='<span class=\"nm\">📄 '+esc(f.name)+\"<\/span>\";\n      var bts=document.createElement(\"span\"); bts.className=\"row\";\n      var cp=document.createElement(\"button\"); cp.className=\"btn ghost mini\"; cp.textContent=\"कॉपी\";\n      cp.onclick=function(){ copyText(url); };\n      var op=document.createElement(\"button\"); op.className=\"btn ghost mini\"; op.textContent=\"खोलो\";\n      op.onclick=function(){ window.open(url,\"_blank\"); };\n      var dl=document.createElement(\"button\"); dl.className=\"btn danger mini\"; dl.textContent=\"✕\";\n      dl.setAttribute(\"aria-label\",\"हटाओ\"); dl.title=\"हटाओ\";\n      dl.onclick=function(){ deleteFile(f.name, f.sha); };\n      bts.appendChild(cp); bts.appendChild(op); bts.appendChild(dl); row.appendChild(bts); fl.appendChild(row);\n    });\n  })\n  .catch(function(e){\n    $(\"dirChips\").innerHTML='<span class=\"tag st-err\">'+esc(e.message)+\"<\/span>\";\n  });\n}\n$(\"mkDir\").onclick=function(){\n  var v=$(\"newDir\").value.trim().replace(/\\s+/g,\"-\").replace(/^\\/+|\\/+$/g,\"\");\n  if(!v) return;\n  state.path=(state.path?state.path+\"/\":\"\")+v; save();\n  $(\"newDir\").value=\"\"; refresh();\n  toast(\"फ़ोल्डर तैयार — अब फ़ाइल डालो\");\n};\n\n/* ---------- अपलोड ---------- */\nvar drop=$(\"drop\"), fi=$(\"fileInput\");\ndrop.onclick=function(){ fi.click(); };\ndrop.ondragover=function(e){ e.preventDefault(); drop.classList.add(\"over\"); };\ndrop.ondragleave=function(){ drop.classList.remove(\"over\"); };\ndrop.ondrop=function(e){ e.preventDefault(); drop.classList.remove(\"over\"); handleFiles(e.dataTransfer.files); };\nfi.onchange=function(){ handleFiles(fi.files); fi.value=\"\"; };\n\n/* नाम अपने आप छोटा करो — सुरक्षित नियम */\nvar STOP={jaiho:1,jai:1,ho:1,jahostudy:1,bodhi:1,bodhiclasses:1,classes:1,\n  test:1,tests:1,mock:1,paper:1,quiz:1,exam:1,set:1,\n  gs:1,cs:1,csat:1,pcs:1,uppcs:1,upsc:1,lower:1,upper:1,pre:1,prelims:1,mains:1,final:1,copy:1};\nfunction autoShort(fname){\n  var dot=fname.lastIndexOf(\".\");\n  var ext=dot>-1?fname.slice(dot).toLowerCase():\"\";\n  var base=(dot>-1?fname.slice(0,dot):fname).toLowerCase();\n  base=base.replace(/\\([^)]*\\)/g,\" \").replace(/\\[[^\\]]*\\]/g,\" \"); // (2) [..] हटाओ\n  base=base.replace(/\\d{8}/g,\" \");                                 // 8-अंकी तारीख़\n  base=base.replace(/[_\\s]+/g,\"-\").replace(/[^a-z0-9\\-]+/g,\"-\");   // साफ़ करो\n  var parts=base.split(\"-\").filter(Boolean);\n  var dedup=[]; for(var i=0;i<parts.length;i++){ if(i===0||parts[i]!==parts[i-1]) dedup.push(parts[i]); }\n  var kept=dedup.filter(function(w){ return !STOP[w]; });\n  var use=kept.length?kept:dedup;      // सब फ़िलर हों तो मूल शब्द रखो\n  if(use.length>4) use=use.slice(0,4); // बहुत लंबा हो तो पहले 4 शब्द\n  var out=use.join(\"-\").replace(/-+/g,\"-\").replace(/^-|-$/g,\"\");\n  if(!out) out=\"file\";\n  return out+ext;\n}\nfunction uniqueName(name){\n  var dot=name.lastIndexOf(\".\"), ext=dot>-1?name.slice(dot):\"\", base=dot>-1?name.slice(0,dot):name;\n  var pathPre=(state.path?state.path+\"/\":\"\").toLowerCase();\n  function taken(n){ return curFiles.indexOf((pathPre+n).toLowerCase())>-1 || curFiles.indexOf(n.toLowerCase())>-1; }\n  if(!taken(base+ext)) return base+ext;\n  var i=2; while(taken(base+\"-\"+i+ext)) i++;\n  return base+\"-\"+i+ext;\n}\nfunction deleteFile(name, sha){\n  if(state.path===\"\"&&name.toLowerCase()===\"index.html\"){\n    alert(\"यह होम की index.html है — यही तुम्हारी वेबसाइट/यंत्रशाला का मुख्य पन्ना है। सुरक्षा के लिए इसे डैशबोर्ड से हटाना बंद रखा गया है।\");\n    return;\n  }\n  if(!confirm('\"'+name+'\" हमेशा के लिए हटाएँ?\\nइसका लिंक बंद हो जाएगा — बच्चों को बाँटा हुआ लिंक भी काम नहीं करेगा।')) return;\n  var p=prof();\n  var full=(state.path?state.path+\"/\":\"\")+name;\n  api(\"contents/\"+encPath(full),{ method:\"DELETE\",\n    body:JSON.stringify({ message:\"हटाया: \"+name, sha:sha, branch:p.branch }) })\n  .then(function(r){\n    if(!r.ok){ return r.json().catch(function(){return {};}).then(function(j){ throw new Error(j.message||(\"त्रुटि \"+r.status)); }); }\n    toast(\"हटा दिया\");\n    var i=curFiles.indexOf(full.toLowerCase()); if(i>-1) curFiles.splice(i,1);\n    refresh();\n  })\n  .catch(function(e){ alert(\"हटा नहीं पाए: \"+e.message); });\n}\n\nfunction toB64(file){\n  return new Promise(function(res,rej){\n    var fr=new FileReader();\n    fr.onload=function(){ res(String(fr.result).split(\",\")[1]); };\n    fr.onerror=function(){ rej(new Error(\"फ़ाइल पढ़ नहीं पाए\")); };\n    fr.readAsDataURL(file);\n  });\n}\nfunction getSha(fullPath){\n  var p=prof();\n  return api(\"contents/\"+encPath(fullPath)+\"?ref=\"+encodeURIComponent(p.branch))\n  .then(function(r){ if(!r.ok) return null; return r.json(); })\n  .then(function(j){ return (j&&!Array.isArray(j)&&j.sha)?j.sha:null; })\n  .catch(function(){ return null; });\n}\nfunction handleFiles(list){\n  var files=Array.prototype.slice.call(list||[]);\n  if(!files.length) return;\n  if(!prof()){ toast(\"पहले प्रोफ़ाइल बनाओ\"); return; }\n  files.forEach(function(f){ makePrep(f); });\n}\n\n/* फ़ाइल चुनते ही: छोटा नाम अपने आप बने, आदित्य \nइसे बदलने से पूरा पहला पन्ना बदल जाएगा। पक्का बदलना है?\")) return;\n    }\n    up.disabled=true; cancel.disabled=true;\n    doUpload(file, nm, card);\n  };\n}\n\nfunction doUpload(file, name, card){\n  var p=prof();\n  var full=(state.path?state.path+\"/\":\"\")+name;\n  $(\"liveNote\").classList.remove(\"hide\");\n  card.innerHTML='<div class=\"fn\">📄 '+esc(name)+' <span class=\"st-wait\"><span class=\"spin\">◌<\/span> अपलोड हो रहा…<\/span><\/div>';\n\n  if(file.size>40*1024*1024){\n    card.innerHTML='<div class=\"fn\">📄 '+esc(name)+' <span class=\"st-err\">✕ 40 MB से बड़ी फ़ाइल यहाँ से नहीं जाएगी<\/span><\/div>';\n    return;\n  }\n  toB64(file).then(function(content){\n    return getSha(full).then(function(sha){\n      var body={ message:(sha?\"अपडेट: \":\"अपलोड: \")+name, content:content, branch:p.branch };\n      if(sha) body.sha=sha;\n      return api(\"contents/\"+encPath(full),{ method:\"PUT\", body:JSON.stringify(body) });\n    });\n  })\n  .then(function(r){\n    if(!r.ok){\n      return r.json().catch(function(){return {};}).then(function(j){ throw new Error(j.message||(\"त्रुटि \"+r.status)); });\n    }\n    if(curFiles.indexOf(full.toLowerCase())===-1) curFiles.push(full.toLowerCase());\n    var url=pagesUrl(full);\n    var fn=document.createElement(\"div\"); fn.className=\"fn\";\n    fn.innerHTML='📄 '+esc(name)+' <span class=\"st-ok\">✓ अपलोड हो गया<\/span>';\n    var u=document.createElement(\"div\"); u.className=\"url\"; u.textContent=url;\n    var row=document.createElement(\"div\"); row.className=\"row\";\n    var cp=document.createElement(\"button\"); cp.className=\"btn mini\"; cp.textContent=\"लिंक कॉपी\";\n    cp.onclick=function(){ copyText(url); };\n    var op=document.createElement(\"button\"); op.className=\"btn ghost mini\"; op.textContent=\"खोलो\";\n    op.onclick=function(){ window.open(url,\"_blank\"); };\n    card.innerHTML=\"\"; card.appendChild(fn); card.appendChild(u); card.appendChild(row);\n    row.appendChild(cp); row.appendChild(op);\n    if(navigator.share){\n      var sh=document.createElement(\"button\"); sh.className=\"btn ghost mini\"; sh.textContent=\"शेयर\";\n      sh.onclick=function(){ navigator.share({title:name,url:url}).catch(function(){}); };\n      row.appendChild(sh);\n    }\n    refresh();\n  })\n  .catch(function(e){\n    card.innerHTML='<div class=\"fn\">📄 '+esc(name)+' <span class=\"st-err\">✕ '+esc(e.message)+\"<\/span><\/div>\";\n  });\n}\n\n/* ---------- शुरुआत ---------- */\nrenderAll();\nif(prof()) refresh();\n})();\n<\/script>\n<\/body>\n<\/html>\n","pinned":true,"uses":0,"createdAt":1783770097371,"updatedAt":1783770097371,"history":[],"seedRev":1}],"settings":{"sort":"smart","compact":false},"lastBackup":0,"schemaVersion":2}</script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const words=s=>(String(s).trim().match(/\S+/g)||[]).length;
const PH=/\[([^\[\]\n]{1,120})\]/g;
const fmt=t=>{if(!t)return '—';const d=new Date(t);const p=n=>String(n).padStart(2,'0');return d.getDate()+'/'+(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2)+' '+p(d.getHours())+':'+p(d.getMinutes());};

/* ---------- storage: Artifact cloud (db) -> browser -> memory ---------- */
const KEY='tijori-v1';
let MODE='memory'; let MEM=null; let DB=null; let CDB=null;
const UI={q:'', cat:'all', type:'all'};

const ENCO=new TextEncoder();
const bsize=s=>ENCO.encode(s).length;
const MAXDOC=190000, CH=40000;
let SHADOW={}, PARTS={}, MYREV=0, REVWARN=false, SEEDING=false;

function safeId(s){
  const t=String(s||'').replace(/[^A-Za-z0-9_.~:@+-]/g,'-').slice(0,120);
  return (t && t!=='.' && t!=='..') ? t : uid();
}
function normIds(){
  const seen=new Set();
  for(const it of DB.items){
    let id=safeId(it.id);
    while(seen.has(id)) id=uid();
    if(id!==it.id){ if(SHADOW[it.id]){ delete SHADOW[it.id]; } it.id=id; }
    seen.add(id);
  }
}

async function detectMode(){
  try{
    if(window.claude && typeof window.claude.use==='function'){
      const d=await window.claude.use('db');
      if(d){ CDB=d; MODE='cloud'; return; }
    }
  }catch(e){}
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); MODE='local'; }catch(e){ MODE='memory'; }
}

function metaDoc(){
  return {v:DB.v||1, seedV:DB.seedV||1, schemaVersion:DB.schemaVersion||1,
    categories:DB.categories||[], settings:DB.settings||{sort:'smart',compact:false},
    lastBackup:DB.lastBackup||0, order:DB.items.map(x=>x.id)};
}

async function cloudLoad(){
  const ms=await CDB.doc('vault/meta').get();
  if(!ms.exists) return null;
  const m=ms.data()||{};
  const qs=await CDB.collection('items').get();
  const items=[];
  for(const d of qs.docs){
    const o=Object.assign({}, d.data()||{});
    o.id=d.id;
    PARTS[d.id]=o.parts||0;
    if(o.parts){
      const ps=await CDB.collection('items/'+d.id+'/parts').get();
      const arr=ps.docs.slice().sort((a,b)=>(parseInt(a.id.slice(1),10)||0)-(parseInt(b.id.slice(1),10)||0));
      o.content=arr.map(x=>(x.data()||{}).t||'').join('');
      delete o.parts;
    }
    if(typeof o.content!=='string') o.content='';
    if(!Array.isArray(o.history)) o.history=[];
    items.push(o);
  }
  const ord=Array.isArray(m.order)?m.order:[];
  items.sort((a,b)=>{ const x=ord.indexOf(a.id), y=ord.indexOf(b.id); return (x<0?1e9:x)-(y<0?1e9:y); });
  MYREV=m.rev||0;
  SHADOW={}; for(const it of items) SHADOW[it.id]=JSON.stringify(it);
  return {v:m.v||1, seedV:m.seedV||1, schemaVersion:m.schemaVersion||1,
    categories:Array.isArray(m.categories)?m.categories:[],
    settings:m.settings||{sort:'smart',compact:false},
    lastBackup:m.lastBackup||0, items:items};
}

async function writeItem(it){
  const body=Object.assign({}, it);
  delete body.id;
  body.history=Array.isArray(it.history)?it.history.slice(0,8):[];
  const c=String(it.content||'');
  let chunks=[];
  const split=()=>{ chunks=[]; for(let i=0;i<c.length;i+=CH) chunks.push(c.slice(i,i+CH)); body.content=''; body.parts=chunks.length; };
  if(c.length>CH) split();
  while(bsize(JSON.stringify(body))>MAXDOC && body.history.length) body.history.pop();
  if(bsize(JSON.stringify(body))>MAXDOC && !chunks.length) split();
  await CDB.doc('items/'+it.id).set(body);
  const col=CDB.collection('items/'+it.id+'/parts');
  for(let i=0;i<chunks.length;i++) await col.doc('p'+i).set({t:chunks[i]});
  const prev=PARTS[it.id]||0;
  for(let i=chunks.length;i<prev;i++){ try{ await col.doc('p'+i).delete(); }catch(e){} }
  PARTS[it.id]=chunks.length;
}

async function removeItem(id){
  const n=PARTS[id]||0;
  const col=CDB.collection('items/'+id+'/parts');
  for(let i=0;i<n;i++){ try{ await col.doc('p'+i).delete(); }catch(e){} }
  delete PARTS[id];
  await CDB.doc('items/'+id).delete();
}

async function cloudSave(){
  normIds();
  let changed=false;
  const live=new Set();
  for(const it of DB.items){
    live.add(it.id);
    const s=JSON.stringify(it);
    if(SHADOW[it.id]===s) continue;
    await writeItem(it); SHADOW[it.id]=s; changed=true;
  }
  for(const k of Object.keys(SHADOW)){
    if(k==='__meta' || live.has(k)) continue;
    await removeItem(k); delete SHADOW[k]; changed=true;
  }
  const base=JSON.stringify(metaDoc());
  if(changed || SHADOW.__meta!==base){
    const md=metaDoc(); md.rev=Date.now(); MYREV=md.rev;
    await CDB.doc('vault/meta').set(md);
    SHADOW.__meta=base;
  }
}

async function loadDB(){
  if(MODE==='cloud'){ try{ return await cloudLoad(); }catch(e){ banner('cloud से पढ़ने में दिक़्क़त — पन्ना फिर से खोलो'); throw e; } }
  if(MODE==='local'){ try{ const v=localStorage.getItem(KEY); if(v) return JSON.parse(v); }catch(e){} return null; }
  return MEM;
}

async function persist(){
  if(!DB) return;
  try{
    if(MODE==='cloud'){ await cloudSave(); }
    else if(MODE==='local'){
      const s=JSON.stringify(DB);
      if(s.length>4500000) toast('⚠ डेटा 4.5MB के पास — backup लेकर भारी apps हटाओ');
      localStorage.setItem(KEY,s);
    }
    else { MEM=DB; }
    footRender();
  }catch(e){
    const c=(e&&e.code)||'';
    if(c==='quota_exceeded') banner('तिजोरी की जगह भर गई — कुछ भारी apps हटाओ, फिर सुरक्षित होगा');
    else if(c==='revoked'||c==='not_granted') banner('इस window की पहुँच बंद हो गई — पन्ना फिर से खोलो (refresh)');
    else banner('save में दिक्कत आई — अभी ⬇⬆ Backup से JSON उतार लो');
  }
}

async function checkFresh(){
  if(MODE!=='cloud' || !CDB || SEEDING || REVWARN) return;
  try{
    const s=await CDB.doc('vault/meta').get();
    const r=(s.exists?(s.data()||{}):{}).rev||0;
    if(r>MYREV+2000){ REVWARN=true; banner('दूसरे डिवाइस पर बदलाव हुआ है — पन्ना ताज़ा (refresh) करो'); }
  }catch(e){}
}

let DLP=null;
function getDownloads(){
  if(!DLP) DLP=(window.claude && typeof window.claude.use==='function') ? window.claude.use('downloads').catch(()=>null) : Promise.resolve(null);
  return DLP;
}

let saveTimer=null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(persist,300); }

function seedDB(){
  try{ return JSON.parse(document.getElementById('seed').textContent); }
  catch(e){ return {v:1,categories:[{id:'other',name:'📦 अन्य'}],items:[],settings:{sort:'smart',compact:false},lastBackup:0}; }
}

/* ---------- render ---------- */
function catName(id){ const c=DB.categories.find(x=>x.id===id); return c?c.name:'📦 अन्य'; }
function chipRender(){
  let h='<button class="chip'+(UI.cat==='all'?' on':'')+'" data-cat="all">सभी</button>';
  for(const c of DB.categories){ h+='<button class="chip'+(UI.cat===c.id?' on':'')+'" data-cat="'+c.id+'">'+esc(c.name)+'</button>'; }
  h+='<button class="chip add" data-act="addcat">+ श्रेणी</button><button class="chip gear" data-act="managecat" title="श्रेणियाँ बदलो">⚙</button>';
  $('#chips').innerHTML=h;
}
function filtered(){
  const q=UI.q.trim().toLowerCase();
  let list=DB.items.filter(it=>{
    if(UI.cat!=='all' && it.cat!==UI.cat) return false;
    if(UI.type!=='all' && it.type!==UI.type) return false;
    if(q){ const hay=(it.name+' '+(it.notes||'')+' '+it.content).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  const s=(DB.settings&&DB.settings.sort)||'smart';
  if(s==='name') list.sort((a,b)=>a.name.localeCompare(b.name,'hi'));
  else if(s==='recent') list.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  else list.sort((a,b)=>((b.pinned?1:0)-(a.pinned?1:0))||((b.uses||0)-(a.uses||0))||((b.updatedAt||0)-(a.updatedAt||0)));
  return list;
}
function cardHTML(it,i){
  const ph=[...new Set([...it.content.matchAll(PH)].map(m=>m[1]))];
  const delay=Math.min(i*0.04,0.4);

/* ---------- clipboard ---------- */
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    try{ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); const ok=document.execCommand('copy'); ta.remove(); return ok; }
    catch(e2){ return false; }
  }
}
async function doCopy(it, text){
  const ok=await copyText(text!==undefined?text:it.content);
  if(ok){ it.uses=(it.uses||0)+1; it.lastUsed=Date.now(); save(); toast('कॉपी हो गया ✓'); renderGrid(); }
  else toast('कॉपी नहीं हो पाया — ⋮ खोलकर हाथ से चुन लो');
}

/* ---------- add / edit ---------- */

    +'<label>नोट — कब इस्तेमाल करना है (1 पंक्ति)</label><input id="f-notes" value="'+(it?esc(it.notes||''):'')+'">'

/* ---------- fill & copy ---------- */
function fillModal(it){
  const ph=[...new Set([...it.content.matchAll(PH)].map(m=>m[1]))];
  if(!ph.length) return doCopy(it);
  const fields=ph.map(p=>'<label>'+esc(p)+'</label><textarea class="fillf" data-p="'+esc(p)+'" rows="3"></textarea>').join('');
  modal('<h2>भरकर कॉपी</h2><p class="dim">जो ख़ाली छोड़ोगे, वह जगह जैसी है वैसी रहेगी।</p>'+fields
    +'<div class="mrow"><button class="btn ghost" data-close="1">रद्द</button><button class="btn gold" id="fill-go">कॉपी करो</button></div>','wide');
  $('#fill-go').onclick=()=>{
    let out=it.content;
    document.querySelectorAll('.fillf').forEach(f=>{ const v=f.value; if(v.trim()) out=out.split('['+f.dataset.p+']').join(v); });
    closeModal(); doCopy(it,out);

/* ---------- detail + history ---------- */
function detailModal(id){
  const it=DB.items.find(x=>x.id===id); if(!it) return;
  const ph=[...new Set([...it.content.matchAll(PH)].map(m=>m[1]))];
  const hist=(it.history||[]).map((h,i)=>'<div class="hrow"><div class="hinfo">'+fmt(h.savedAt)+' · '+words(h.content)+' शब्द</div>'
    +'<div class="hacts"><button class="btn tiny" data-h="copy" data-i="'+i+'">कॉपी</button>'
    +'<button class="btn tiny" data-h="restore" data-i="'+i+'">वापस लाओ</button>'
    +'<button class="btn tiny danger" data-h="del" data-i="'+i+'">हटाओ</button></div></div>').join('')
    || '<p class="dim">अभी कोई पुराना रूप नहीं — हर edit पर अपने-आप जुड़ेगा।</p>';
  modal('<h2>'+esc(it.name)+'</h2>'
    +'<p class="dim">'+(it.type==='app'?'App':'प्रॉम्प्ट')+' · '+esc(catName(it.cat))+' · '+words(it.content)+' शब्द · '+(it.uses||0)+' बार · आख़िरी बदलाव '+fmt(it.updatedAt)+'</p>'
    +(it.notes?'<p class="note">'+esc(it.notes)+'</p>':'')
    +'<div class="mrow wrap"><button class="btn gold" data-d="copy">कॉपी</button>'
    +(ph.length?'<button class="btn" data-d="fill">भरकर कॉपी</button>':'')
    +(it.type==='app'?'<button class="btn" data-d="run">▶ चलाओ</button><button class="btn" data-d="down">⬇ download</button>':'')
    +'<button class="btn" data-d="dup">नक़ल बनाओ</button><button class="btn danger" data-d="delitem">हटाओ</button></div>'
    +'<pre class="code">'+esc(it.content)+'</pre>'
    +'<h3 class="hh">पुराने रूप ('+((it.history||[]).length)+')</h3>'+hist
    +'<div class="mrow"><button class="btn ghost" data-close="1">बंद</button></div>','wide');
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.d;
    if(a==='copy') doCopy(it);
    else if(a==='fill'){ closeModal(); fillModal(it); }
    else if(a==='run'){ closeModal(); runApp(it); }
    else if(a==='down') downloadFile(it.name.replace(/\s+/g,'-')+'.html', it.content, 'text/html');
    else if(a==='dup'){ const c=JSON.parse(JSON.stringify(it)); c.id=uid(); c.name=it.name+' — नक़ल'; c.uses=0; c.pinned=false; c.createdAt=Date.now(); c.updatedAt=Date.now(); DB.items.unshift(c); save(); closeModal(); renderAll(); toast('नक़ल बन गई ✓'); }
    else if(a==='delitem') confirmModal('"'+it.name+'" पूरा हटेगा — इतिहास समेत।', ()=>{ DB.items=DB.items.filter(x=>x.id!==it.id); save(); closeModal(); renderAll(); toast('हटा दिया'); });
  });
  document.querySelectorAll('[data-h]').forEach(b=>b.onclick=async()=>{
    const i=+b.dataset.i, a=b.dataset.h, h=it.history[i]; if(!h) return;
    if(a==='copy'){ if(await copyText(h.content)) toast('पुराना रूप कॉपी ✓'); }
    else if(a==='restore'){ it.history.splice(i,1); it.history.unshift({content:it.content, savedAt:it.updatedAt||Date.now()}); it.content=h.content; it.updatedAt=Date.now(); save(); renderAll(); detailModal(id); toast('पुराना रूप वापस आ गया — अभी वाला इतिहास में ✓'); }
    else if(a==='del'){ it.history.splice(i,1); save(); renderAll(); detailModal(id); toast('वह रूप हटा'); }
  });
}

/* ---------- app run / download ---------- */
function runApp(it){
  const ov=$('#runOverlay');
  ov.innerHTML='<div class="runbar"><span>'+esc(it.name)+'</span><button class="btn ghost" id="run-close">✕ बंद</button></div><iframe id="runframe"></iframe>';
  ov.style.display='flex';
  const f=$('#runframe');
  f.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads');
  f.srcdoc=it.content;
  $('#run-close').onclick=()=>{ ov.style.display='none'; ov.innerHTML=''; };
}
async function downloadFile(name, content, mime){
  try{
    const dl=await getDownloads();
    if(dl){ await dl.save({filename:name, data:content}); toast('फ़ाइल सुरक्षित ✓'); return; }
  }catch(e){
    const c=(e&&e.code)||'';
    if(c==='declined'){ toast('रद्द कर दिया'); return; }
    if(c==='rate_limited'){ toast('एक साथ एक ही — थोड़ा रुककर फिर दबाओ'); return; }
    if(c==='rejected_extension'){ toast('इस तरह की फ़ाइल यहाँ नहीं सहेजी जा सकती'); return; }
  }
  try{
    const b=new Blob([content],{type:mime||'text/plain'});
    const u=URL.createObjectURL(b);
    const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),3000);
    toast('download शुरू ✓');
  }catch(e){ toast('यहाँ download बंद है — कोड कॉपी करके फ़ाइल बना लो'); }
}

function backupModal(){
  modal('<h2>Backup — तुम्हारा बीमा</h2>'
    +'<p class="dim">पूरी तिजोरी 1 JSON में। आख़िरी backup: '+(DB.lastBackup?fmt(DB.lastBackup):'कभी नहीं')+'</p>'

    +'<h3 class="hh">वापस लाओ (import)</h3>'
    +'<p class="dim">backup फ़ाइल चुनो या JSON नीचे चिपकाओ — फिर जोड़ो या बदलो।</p>'
    +'<input type="file" id="b-file" accept=".json,application/json">'
    +'<label> </label><textarea id="b-paste" rows="4" placeholder="यहाँ JSON चिपकाओ"></textarea>'
    +'<div class="mrow wrap"><button class="btn" id="b-merge">सिर्फ़ नए जोड़ो</button><button class="btn danger" id="b-replace">पूरा बदलो</button><button class="btn ghost" data-close="1">बंद</button></div>','wide');
  const stamp=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
  $('#b-down').onclick=()=>{ downloadFile('tijori-backup-'+stamp()+'.json', JSON.stringify(DB), 'application/json'); DB.lastBackup=Date.now(); save(); };
  $('#b-copy').onclick=async()=>{ if(await copyText(JSON.stringify(DB))){ DB.lastBackup=Date.now(); save(); toast('JSON कॉपी हो गया ✓'); } };
  $('#b-file').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ $('#b-paste').value=r.result; toast('फ़ाइल पढ़ ली — अब जोड़ो या बदलो दबाओ'); }; r.readAsText(f); };
  const parse=()=>{ try{ const d=JSON.parse($('#b-paste').value); if(!d||!Array.isArray(d.items)) throw 0; return d; }catch(e){ toast('JSON सही नहीं है'); return null; } };
  $('#b-merge').onclick=()=>{ const d=parse(); if(!d) return;
    let n=0;
    for(const c of (d.categories||[])) if(!DB.categories.find(x=>x.name===c.name)) DB.categories.push(c);
    for(const it of d.items) if(!DB.items.find(x=>x.name===it.name)){ DB.items.push(it); n++; }
    save(); closeModal(); renderAll(); toast(n+' नई चीज़ें जुड़ीं ✓'); };
  $('#b-replace').onclick=()=>{ const d=parse(); if(!d) return;
    confirmModal('अभी की पूरी तिजोरी हटकर backup वाली आ जाएगी।', ()=>{ DB=d; if(!DB.settings) DB.settings={sort:'smart',compact:false}; save(); closeModal(); renderAll(); toast('backup वापस आ गया ✓'); }); };
}

/* ---------- events ---------- */
function bind(){
  $('#q').addEventListener('input',e=>{ UI.q=e.target.value; renderGrid(); });
  document.addEventListener('keydown',e=>{
    const tag=document.activeElement?document.activeElement.tagName:'';
    if(e.key==='/' && tag!=='INPUT' && tag!=='TEXTAREA'){ e.preventDefault(); $('#q').focus(); }
    if(e.key==='Escape'){ closeModal(); const ov=$('#runOverlay'); if(ov.style.display!=='' && ov.style.display!=='none'){ ov.style.display='none'; ov.innerHTML=''; } }
  });
  $('#newPrompt').onclick=()=>editModal(null,'prompt');
  $('#newApp').onclick=()=>editModal(null,'app');
  $('#backupBtn').onclick=backupModal;
  $('#helpBtn').onclick=helpModal;
  $('#popupBtn').onclick=popupOpen;
  $('#compactBtn').onclick=()=>{ DB.settings.compact=!DB.settings.compact; document.body.classList.toggle('compact',DB.settings.compact); save(); };
  $('#sortSel').onchange=e=>{ DB.settings.sort=e.target.value; save(); renderGrid(); };
  document.querySelectorAll('#typeSeg button').forEach(b=>b.onclick=()=>{ UI.type=b.dataset.t; document.querySelectorAll('#typeSeg button').forEach(x=>x.classList.toggle('on',x===b)); renderGrid(); });
  $('#chips').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.act==='addcat') return addCatModal();
    if(b.dataset.act==='managecat') return manageCatModal();
    if(b.dataset.cat!==undefined){ UI.cat=b.dataset.cat; chipRender(); renderGrid(); }
  });
  $('#grid').addEventListener('click',e=>{
    const a=e.target.closest('[data-act]'); if(!a) return;
    const card=e.target.closest('.card'); if(!card) return;
    const it=DB.items.find(x=>x.id===card.dataset.id); if(!it) return;
    const act=a.dataset.act;
    if(act==='copy') doCopy(it);
    else if(act==='fill') fillModal(it);
    else if(act==='run') runApp(it);
    else if(act==='edit') editModal(it.id);
    else if(act==='detail') detailModal(it.id);
    else if(act==='pin'){ it.pinned=!it.pinned; save(); renderGrid(); }
  });
  $('#modalRoot').addEventListener('click',e=>{ if(e.target.dataset && e.target.dataset.close) closeModal(); });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') persist(); else checkFresh(); });
}

/* ---------- init ---------- */
(async function init(){
  await detectMode();
  const d=await loadDB();
  if(d && Array.isArray(d.items)){
    DB=d;
    const S=seedDB(); const sv=S.seedV||1;
    if((DB.seedV||1)<sv){
      DB.categories=DB.categories||[];
      DB.items=DB.items||[];
      let added=0, updated=0;
      for(const c of (S.categories||[])) if(!DB.categories.find(x=>x.id===c.id||x.name===c.name)) DB.categories.push(c);
      for(const si of (S.items||[])){
        let old=DB.items.find(x=>x.id===si.id);
        if(!old) old=DB.items.find(x=>x.name===si.name);
        if(!old){ DB.items.push(si); added++; continue; }
        const incomingRev=Number(si.seedRev||0), currentRev=Number(old.seedRev||0);
        if(incomingRev>currentRev){
          const oldContent=old.content;
          const keepPinned=old.pinned, keepUses=old.uses||0, keepCreated=old.createdAt||si.createdAt||Date.now(), keepLastUsed=old.lastUsed;
          const keepHistory=Array.isArray(old.history)?old.history.slice():[];
          if(oldContent && oldContent!==si.content) keepHistory.unshift({content:oldContent,savedAt:old.updatedAt||Date.now()});
          Object.assign(old,si);
          old.pinned=keepPinned!==undefined?keepPinned:!!si.pinned;
          old.uses=keepUses; old.createdAt=keepCreated; old.history=keepHistory.slice(0,10);
          if(keepLastUsed) old.lastUsed=keepLastUsed;
          updated++;
        }
      }
      DB.seedV=sv; DB.schemaVersion=S.schemaVersion||DB.schemaVersion||1; await persist();
      if(added||updated) toast((added?added+' नई':'')+(added&&updated?' और ':'')+(updated?updated+' अपडेट':'')+' चीज़ें अपने-आप सुरक्षित हुईं ✓');
    }
  }
  else {
    DB=seedDB(); SEEDING=true;
    if(MODE==='cloud') banner('पहली बार तिजोरी cloud में सुरक्षित हो रही है — कुछ पल रुको…');
    await persist(); SEEDING=false;
    $('#banner').style.display='none';
    toast('तिजोरी तैयार — '+DB.items.length+' चीज़ें पहले से अंदर ✓');
  }
  if(!DB.settings) DB.settings={sort:'smart',compact:false};
  if(MODE==='memory') banner('⚠ यह जगह save स्थायी नहीं रखेगी — फ़ाइल download करके browser में खोलो, और ⬇⬆ Backup लेते रहो');
  document.body.classList.toggle('compact', !!DB.settings.compact);
  $('#sortSel').value=DB.settings.sort||'smart';
  renderAll(); bind();
})();
</script>
