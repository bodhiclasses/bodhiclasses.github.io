<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="बोधि नोट्स">
<meta name="theme-color" content="#f6f6f9">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>बोधि नोट्स</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#ececf1;--card:#fff;--line:#dedee6;--txt:#1a1a22;--mut:#6d6d7c;--acc:#2458e6;--accbg:#e6edff;--red:#d92534;--st:env(safe-area-inset-top,0px);--tb:54px}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:-apple-system,system-ui,"Segoe UI","Noto Sans Devanagari",sans-serif;font-size:16px}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
svg{width:22px;height:22px;flex:none;display:block}

/* ---------- लाइब्रेरी ---------- */
#lib{position:fixed;inset:0;display:none;flex-direction:column}
body[data-mode=lib] #lib{display:flex}
#lh{flex:none;padding:calc(var(--st) + 14px) 20px 12px;background:rgba(246,246,249,.94);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#lh h1{margin:0;font-size:26px;font-weight:700;flex:1;min-width:150px;display:flex;align-items:center;gap:8px}
#lh h1 button{border:none;background:none;padding:6px;margin-left:-8px;border-radius:10px;color:var(--acc)}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600}
.tbtn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.tbtn svg{width:18px;height:18px}
#q{flex:1 1 100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-size:16px;font-family:inherit;outline:none}
#q:focus{border-color:var(--acc)}
#ls{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 20px calc(40px + env(safe-area-inset-bottom,0px))}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 16px}
.card{position:relative;cursor:pointer}
.card .th{aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 2px 10px rgba(20,20,40,.14);display:flex;align-items:center;justify-content:center}
.card .th img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;pointer-events:none}
.card.fold .th{background:linear-gradient(160deg,#ffd76a,#f7b733);box-shadow:0 2px 10px rgba(180,120,0,.25);flex-direction:column;gap:6px;color:#5b3d00}
.card.fold .th svg{width:54px;height:54px;stroke-width:1.4}
.card.fold .th b{font-size:13px;font-weight:600}
.card .nm{margin:8px 26px 0 2px;font-size:14.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.card .sub{margin:2px 2px 0;font-size:12.5px;color:var(--mut)}
.card .dots{position:absolute;right:-6px;bottom:auto;margin-top:2px;top:calc(100% - 0px);transform:translateY(-100%);border:none;background:none;padding:8px;color:var(--mut);border-radius:10px}
.card .del{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:50%;border:none;background:rgba(255,255,255,.92);box-shadow:0 1px 5px rgba(0,0,0,.25);color:var(--red);display:flex;align-items:center;justify-content:center;padding:0}
.card .del svg{width:17px;height:17px}
#empty{text-align:center;color:var(--mut);padding:60px 20px;line-height:1.8;font-size:17px}
#empty b{display:block;font-size:21px;color:var(--txt);margin-bottom:6px}
body.drag #ls{outline:3px dashed var(--acc);outline-offset:-10px}

/* ---------- संपादक ---------- */
#ed{position:fixed;inset:0;display:none}
body[data-mode=ed] #ed{display:block}
#tb{position:absolute;left:0;right:0;top:0;height:calc(var(--tb) + var(--st));padding:var(--st) 8px 0;display:flex;align-items:center;gap:2px;background:rgba(248,248,251,.95);border-bottom:1px solid var(--line);z-index:20}
#ctr{flex:1;min-width:0;display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 4px}
#ctr::-webkit-scrollbar{display:none}
.grp{display:flex;align-items:center;gap:2px;flex:none}
.ib{flex:none;width:42px;height:42px;border:none;background:none;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:0;color:#3a3a48}
.ib:active{background:#e4e4ec}
.ib.on{background:var(--accbg);color:var(--acc)}
.ib:disabled{opacity:.3}
.sep{flex:none;width:1px;height:26px;background:var(--line);margin:0 6px}
.sz{flex:none;width:36px;height:42px;border:none;background:none;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0}
.sz i{display:block;border-radius:50%;background:#55556a}
.sz.on{background:var(--accbg)}.sz.on i{background:var(--acc)}
.co{flex:none;width:36px;height:42px;border:none;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.co::before{content:"";width:24px;height:24px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.co.on::before{box-shadow:0 0 0 2.5px #f8f8fb,0 0 0 4.5px var(--acc)}
#cp{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
#view{position:absolute;left:0;right:0;bottom:0;top:calc(var(--tb) + var(--st));overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior:contain}
#pages{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 12px 110px;width:max-content;min-width:100%;will-change:transform}
.pg{position:relative;background:#fff;box-shadow:0 1px 3px rgba(20,20,40,.18),0 6px 18px rgba(20,20,40,.08);flex:none;overflow:hidden}
.pg canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;display:block}
.pg canvas.hl{opacity:.4;mix-blend-mode:multiply}
body.finger .pg{touch-action:none}
#ov{position:absolute;left:0;top:calc(var(--tb) + var(--st));pointer-events:none;z-index:10}
#addpg{flex:none;border:2px dashed #b9b9c8;background:none;border-radius:14px;padding:16px 30px;color:var(--mut);font-size:16px;font-weight:600;display:flex;gap:8px;align-items:center}
#view{scrollbar-width:none}#view::-webkit-scrollbar{display:none}
#fs{position:absolute;right:5px;top:0;width:34px;height:60px;z-index:16;border:none;border-radius:17px;background:#fff;box-shadow:0 2px 10px rgba(20,20,40,.3),0 0 0 1px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;color:#55556a;touch-action:none;opacity:0;pointer-events:none;transition:opacity .25s;padding:0}
#fs::before{content:"";position:absolute;inset:-10px -6px -10px -14px}
#fs.show{opacity:1;pointer-events:auto}
#fs.drag{background:var(--acc);color:#fff;opacity:1}
#fs svg{width:20px;height:20px}
#fsb{position:absolute;right:50px;top:0;z-index:16;background:rgba(22,22,30,.92);color:#fff;border-radius:14px;padding:10px 16px;font-size:18px;font-weight:700;white-space:nowrap;pointer-events:none;display:none}
#fsb.show{display:block}
#pill{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:15;border:none;background:rgba(30,30,40,.78);color:#fff;border-radius:20px;padding:8px 16px;font-size:14px;font-weight:600;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* ---------- पॉपओवर, संवाद, सूचना ---------- */
.pop{position:fixed;z-index:60;background:#fff;border-radius:16px;box-shadow:0 8px 34px rgba(20,20,40,.26),0 0 0 1px rgba(0,0,0,.05);padding:6px;min-width:200px;max-width:92vw;max-height:80vh;overflow:auto}
.pop.menu button{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;padding:12px 14px;font-size:16px;border-radius:10px;text-align:left}
.pop.menu button:active{background:#eeeef4}
.pop.menu button.danger{color:var(--red)}
.pop.menu svg{width:20px;height:20px}
.pop.menu hr{border:none;border-top:1px solid var(--line);margin:4px 8px}
.pop.opts{padding:16px;width:280px}
.pop.opts label{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin-bottom:6px}
.pop.opts label b{color:var(--txt)}
.pop.opts input[type=range]{width:100%;margin:0 0 6px;accent-color:var(--acc)}
.pop.opts .rowb{display:flex;align-items:center;justify-content:space-between;padding:10px 0 2px;font-size:15.5px;gap:12px}
.sw{flex:none;width:48px;height:28px;border-radius:14px;border:none;background:#cfcfd9;position:relative;padding:0;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(20px)}
.seg{display:flex;background:#ececf2;border-radius:10px;padding:3px;margin-top:10px}
.seg button{flex:1;border:none;background:none;padding:8px 6px;border-radius:8px;font-size:14.5px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:600}
.wide{width:100%;margin-top:12px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-size:15px}
.wide.danger{color:var(--red)}
.zrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.zrow button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font-size:15px}
.zrow b{flex:1;text-align:center;font-size:15px}
.dlgw{position:fixed;inset:0;z-index:80;background:rgba(15,15,25,.42);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:380px;box-shadow:0 16px 50px rgba(0,0,0,.3)}
.dlg h3{margin:0 0 8px;font-size:19px}
.dlg p{margin:0 0 6px;color:var(--mut);line-height:1.6;font-size:15.5px}
.dlg input[type=text]{width:100%;margin-top:10px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;font-family:inherit;outline:none}
.dlg input[type=text]:focus{border-color:var(--acc)}
.dlg .acts{display:flex;gap:10px;margin-top:18px}
.dlg .acts button{flex:1;border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:600;background:#ececf2}
.dlg .acts .yes{background:var(--acc);color:#fff}
.dlg .acts .yes.danger{background:var(--red)}
#toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(22,22,30,.93);color:#fff;padding:11px 18px;border-radius:14px;font-size:15px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body data-mode="lib">

<div id="lib">
  <div id="lh">
    <h1 id="ltitle">बोधि नोट्स</h1>
    <label class="tbtn pri" id="addPdf"><span id="icAdd"></span>PDF जोड़ें<input id="file" type="file" accept="application/pdf,.pdf" multiple hidden></label>
    <button class="tbtn" id="addNote"><span id="icNote"></span>नई कॉपी</button>
    <button class="tbtn" id="addFold"><span id="icFold"></span>फ़ोल्डर</button>
    <input id="q" type="text" placeholder="नाम से खोजें" autocomplete="off">
  </div>
  <div id="ls"><div id="grid"></div><div id="empty" hidden></div></div>
</div>

<div id="ed">
  <div id="tb">
    <button class="ib" id="back" aria-label="लाइब्रेरी"></button>
    <div id="ctr">
      <div class="grp" id="tools">
        <button class="ib" data-t="pen" aria-label="पेन"></button>
        <button class="ib" data-t="hl" aria-label="हाईलाइटर"></button>
        <button class="ib" data-t="erase" aria-label="रबर"></button>
        <button class="ib" data-t="laser" aria-label="लेज़र"></button>
      </div>
      <span class="sep"></span>
      <div class="grp" id="sizes"></div>
      <span class="sep" id="csep"></span>
      <div class="grp" id="cols"></div>
    </div>
    <button class="ib" id="undo" aria-label="पीछे"></button>
    <button class="ib" id="redo" aria-label="आगे"></button>
    <button class="ib" id="fing" aria-label="उँगली से लिखें"></button>
    <button class="ib" id="more" aria-label="और"></button>
    <input type="color" id="cp" tabindex="-1">
  </div>
  <div id="view"><div id="pages"></div></div>
  <canvas id="ov"></canvas>
  <button id="fs" aria-label="तेज़ स्क्रॉल"></button><div id="fsb"></div>
  <button id="pill">–</button>
</div>

<div id="toast"></div>

<script>
'use strict';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=s=>document.querySelector(s);
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r2=v=>Math.round(v*100)/100;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const svg=d=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+d.split('|').map(p=>'<path d="'+p+'"/>').join('')+'</svg>';
const IC={
 back:svg('M15 5l-7 7 7 7'),
 pen:svg('M4 20l.9-4.2L16.6 4.1a2 2 0 012.8 0l.5.5a2 2 0 010 2.8L8.2 19.1z|M14.5 6.2l3.3 3.3'),
 hl:svg('M9 14.5l-3 3V20h2.5l3-3|M9 14.5L16.5 5l4 3.5L12 17.5z|M3 21.5h18'),
 erase:svg('M3.5 15.5L13 5.5a2 2 0 012.8 0l3.7 3.7a2 2 0 010 2.8L12 20H7.5z|M9 9.5l6.5 6.5|M12 20h8'),
 laser:svg('M4 20L14.5 9.5|M13 3v3|M21 11h-3|M19.5 4.5l-2.2 2.2|M19.5 17l-1.8-1.8|M7.5 4.5l1.8 1.8'),
 undo:svg('M9 5L4 10l5 5|M4 10h10a5 5 0 010 10h-4'),
 redo:svg('M15 5l5 5-5 5|M20 10H10a5 5 0 000 10h4'),
 hand:svg('M9 11.5V5a1.5 1.5 0 013 0v5|M12 9.5a1.5 1.5 0 013 0V11|M15 10.5a1.5 1.5 0 013 0V15a6 6 0 01-6 6h-.5a6 6 0 01-4.7-2.3L4 14.5a1.5 1.5 0 012.3-1.9L9 15'),
 more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>',
 plus:svg('M12 5v14|M5 12h14'),
 folder:svg('M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z'),
 trash:svg('M4 7h16|M9 7V4h6v3|M6 7l1 13h10l1-13|M10 11v6|M14 11v6'),
 edit:svg('M4 20h4L19 9l-4-4L4 16z'),
 share:svg('M12 15V3|M8 7l4-4 4 4|M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7'),
 move:svg('M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z|M9.5 13h5|M12.5 11l2 2-2 2'),
 note:svg('M6 3h9l4 4v14H6z|M9 10h6|M9 14h6|M9 18h3'),
 clean:svg('M5 5l14 14|M19 5L5 19'),
 fit:svg('M4 12h16|M7 9l-3 3 3 3|M17 9l3 3-3 3')
};

/* ---------- छोटी मदद ---------- */
let tT=null;
function toast(m,ms=2200){const t=$('#toast');if(!m){t.classList.remove('show');return}t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),ms)}
let popEl=null;
function popOut(e){if(popEl&&!popEl.contains(e.target))closePop()}
let popAt=-1e9;
function closePop(){if(popEl){popAt=performance.now();popEl.remove();popEl=null;document.removeEventListener('pointerdown',popOut,true)}}
function showPop(anchor,node){closePop();document.body.appendChild(node);const r=anchor.getBoundingClientRect(),w=node.offsetWidth,h=node.offsetHeight;
 let x=clamp(r.left+r.width/2-w/2,8,innerWidth-w-8),y=r.bottom+8;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-8);
 node.style.left=x+'px';node.style.top=y+'px';popEl=node;setTimeout(()=>{if(popEl===node)document.addEventListener('pointerdown',popOut,true)},0)}
function menu(anchor,items){const m=el('div','pop menu');items.forEach(it=>{if(!it)return;if(it==='-'){m.appendChild(el('hr'));return}
 const b=el('button',it.danger?'danger':'',(it.icon||'')+'<span>'+esc(it.label)+'</span>');b.onclick=()=>{closePop();it.fn()};m.appendChild(b)});showPop(anchor,m)}
function dialog(o){return new Promise(res=>{closePop();const w=el('div','dlgw'),d=el('div','dlg');w.appendChild(d);
 let h='<h3>'+esc(o.title)+'</h3>'+(o.text?'<p>'+esc(o.text)+'</p>':'');
 if(o.input!=null)h+='<input type="text" maxlength="80">';
 if(o.choices)h+='<div class="seg">'+o.choices.map((c,i)=>'<button data-v="'+c[0]+'" class="'+(i?'':'on')+'">'+esc(c[1])+'</button>').join('')+'</div>';
 h+='<div class="acts"><button class="no">रद्द</button><button class="yes '+(o.danger?'danger':'')+'">'+esc(o.ok||'ठीक')+'</button></div>';d.innerHTML=h;
 const inp=d.querySelector('input');let choice=o.choices?o.choices[0][0]:null;
 d.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{choice=b.dataset.v;d.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b))});
 if(inp){inp.value=o.input;setTimeout(()=>{inp.focus();inp.select()},60)}
 const done=v=>{w.remove();res(v)};
 const yes=()=>{if(inp&&!inp.value.trim()){inp.focus();return}done(o.choices?{text:inp?inp.value.trim():'',choice}:inp?inp.value.trim():true)};
 d.querySelector('.no').onclick=()=>done(null);d.querySelector('.yes').onclick=yes;
 w.addEventListener('pointerdown',e=>{if(e.target===w)done(null)});if(inp)inp.onkeydown=e=>{if(e.key==='Enter')yes()};
 document.body.appendChild(w)})}

/* ---------- डिवाइस में सुरक्षित भंडार ---------- */
const DB=(()=>{let p;
 const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('bodhi-pen2',1);
  r.onupgradeneeded=()=>{for(const s of['docs','files','ink','folders'])r.result.createObjectStore(s)};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
 const run=async(stores,mode,fn)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction(stores,mode);let out;
  t.oncomplete=()=>res(out);t.onerror=t.onabort=()=>rej(t.error);out=fn(...[].concat(stores).map(s=>t.objectStore(s)))})};
 return{run,
  get:(s,k)=>run(s,'readonly',st=>st.get(k)).then(q=>q.result),
  all:s=>run(s,'readonly',st=>st.getAll()).then(q=>q.result),
  put:(s,k,v)=>run(s,'readwrite',st=>{st.put(v,k)}),
  del:(s,k)=>run(s,'readwrite',st=>{st.delete(k)})}})();
const inkRange=id=>IDBKeyRange.bound([id,0],[id,1e9]);
async function loadInk(id){const o=await DB.run('ink','readonly',st=>({k:st.getAllKeys(inkRange(id)),v:st.getAll(inkRange(id))}));const m={};o.k.result.forEach((k,i)=>m[k[1]]=o.v.result[i]);return m}

const DEF={tool:'pen',finger:false,

async function importFiles(files){
 files=files.filter(f=>/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name));if(!files.length){toast('सिर्फ़ PDF फ़ाइल चुनिए');return}
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 let last=null,n=0;
 for(const f of files){
  toast('जोड़ रहे हैं: '+f.name,120000);
  try{const buf=await f.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;
   let sizes=[];for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i),vp=pg.getViewport({scale:1});sizes.push([r2(vp.width),r2(vp.height)])}
   if(sizes.every(s=>s[0]===sizes[0][0]&&s[1]===sizes[0][1]))sizes=[sizes[0]];
   const d={id:uid(),kind:'pdf',name:f.name.replace(/\.pdf$/i,''),folder:L.folder,n:pdf.numPages,sizes,size:f.size,created:Date.now(),opened:Date.now()};
   d.thumb=await makeThumb(await pdf.getPage(1),{w:sizes[0][0],h:sizes[0][1]},[]);
   await DB.put('files',d.id,buf);await DB.put('docs',d.id,d);pdf.destroy();L.docs.push(d);last=d;n++}
  catch(e){console.error(e);toast('"'+f.name+'" नहीं जुड़ पाई',3000);await sleep(1600)}}
 renderLib();if(n===1)openDoc(last);else if(n)toast(n+' PDF जुड़ गईं')}

async function openDoc(d){
 if(E.doc)return;toast('खुल रही है…',60000);
 try{
  E.doc=d;E.undo=[];E.redo=[];E.dirty=new Set();E.thumbDirty=false;E.pdf=null;E.bytes=null;E.pages=[];
  const ink=await loadInk(d.id);
  if(d.kind==='pdf'){const buf=await DB.get('files',d.id);if(!buf)throw new Error('no file');E.bytes=new Uint8Array(buf);E.pdf=await pdfjsLib.getDocument({data:E.bytes.slice()}).promise}
  box.innerHTML='';document.body.dataset.mode='ed';sizeOv();
  for(let i=1;i<=d.n;i++){const sz=d.kind==='pdf'?(d.sizes[i-1]||d.sizes[0]):[d.w,d.h];E.pages.push({i,w:sz[0],h:sz[1],paper:d.paper,strokes:ink[i]||[],page:null,cv:null,task:null})}
  zoom=d.zoom&&d.vw===view.clientWidth?d.zoom:fitZoom();
  E.pages.forEach(P=>box.appendChild(pageEl(P)));
  if(d.kind==='note'){const b=el('button','','');b.id='addpg';b.innerHTML=IC.plus+'नया पन्ना';b.onclick=()=>addPage(false);box.appendChild(b)}
  E.pages.forEach(P=>obs.observe(P.el));
  if(d.pos&&E.pages[d.pos[0]]){const P=E.pages[d.pos[0]];view.scrollTop=P.el.offsetTop+d.pos[1]*P.h*zoom}else view.scrollTop=0;
  view.scrollLeft=Math.max(0,(box.scrollWidth-view.clientWidth)/2);
  d.opened=Date.now();DB.put('docs',d.id,d);renderBar();updatePill();toast('');fsUpdate(true);
 }catch(e){console.error(e);E.doc=null;document.body.dataset.mode='lib';toast('यह फ़ाइल नहीं खुल पाई')}
}

function pageEl(P){const e=el('div','pg');P.el=e;elP.set(e,P);layout(P);
 e.addEventListener('pointerdown',ev=>down(ev,P));e.addEventListener('pointermove',ev=>move(ev,P));
 e.addEventListener('pointerup',ev=>up(ev,P,false));e.addEventListener('pointercancel',ev=>up(ev,P,true));
 e.addEventListener('contextmenu',ev=>ev.preventDefault());return e}
function layout(P){P.el.style.width=P.w*zoom+'px';P.el.style.height=P.h*zoom+'px'}
function fitZoom(){const mw=Math.max(...E.pages.map(P=>P.w));return clamp(Math.min((view.clientWidth-24)/mw,1.9),.25,6)}
function getPage(P){return P.page?Promise.resolve(P.page):E.pdf.getPage(P.i).then(pg=>P.page=pg)}

/* ----- सिर्फ़ दिखने वाले पन्ने बनते हैं ----- */
const obs=new IntersectionObserver(es=>{es.forEach(en=>{const P=elP.get(en.target);if(!P)return;en.isIntersecting?mount(P):unmount(P)})},{root:view,rootMargin:'700px 0px'});
function mount(P){if(P.cv)return;const mk=c=>{const e=document.createElement('canvas');e.className=c;P.el.appendChild(e);return e};
 P.cv={bg:null,hl:mk('hl'),ink:mk('ink'),k:1,kh:1};refresh(P)}
function refresh(P){
 const cv=P.cv;if(!cv)return;
 let pr=Math.min(window.devicePixelRatio||1,2.5);const W=P.w*zoom,H=P.h*zoom,cap=5.5e6;if(W*H*pr*pr>cap)pr=Math.sqrt(cap/(W*H));
 const k=cv.k=zoom*pr,kh=cv.kh=k*0.5;
 cv.ink.width=Math.round(P.w*k);cv.ink.height=Math.round(P.h*k);cv.hl.width=Math.round(P.w*kh);cv.hl.height=Math.round(P.h*kh);redraw(P);
 if(P.task){try{P.task.cancel()}catch(e){}P.task=null}
 const bg=document.createElement('canvas');bg.className='bg';bg.width=Math.round(P.w*k);bg.height=Math.round(P.h*k);
 const tok=cv.tok=(cv.tok||0)+1;
 const done=()=>{if(P.cv!==cv||cv.tok!==tok){bg.width=bg.height=0;return}if(cv.bg){cv.bg.width=cv.bg.height=0;cv.bg.remove()}cv.bg=bg;P.el.insertBefore(bg,P.el.firstChild)};
 if(E.pdf)getPage(P).then(pg=>{if(P.cv!==cv||cv.tok!==tok){bg.width=bg.height=0;return}
   const task=pg.render({canvasContext:bg.getContext('2d'),viewport:pg.getViewport({scale:k})});P.task=task;
   task.promise.then(()=>{if(P.task===task)P.task=null;done()}).catch(()=>{bg.width=bg.height=0})}).catch(()=>{});
 else{drawPaper(bg.getContext('2d'),P,k);done()}
}
function unmount(P,force){if(!P.cv)return;if(!force&&cur&&cur.P===P)return;
 if(P.task){try{P.task.cancel()}catch(e){}P.task=null}
 const cv=P.cv;P.cv=null;[cv.bg,cv.hl,cv.ink].forEach(c=>{if(c){c.width=c.height=0;c.remove()}})}
function paperMarks(P){const Ln=[],D=[],w=P.w,h=P.h;
 if(P.paper==='lined'){for(let y=78;y<h-34;y+=27)Ln.push([36,y,w-36,y])}

const bbC=new WeakMap();

 const vr=view.getBoundingClientRect();if(cx==null){cx=vr.left+vr.width/2;cy=vr.top+vr.height/3}
 const P=E.pages[pageAtY(view.scrollTop+cy-vr.top)],r=P.el.getBoundingClientRect(),fx=(cx-r.left)/r.width,fy=(cy-r.top)/r.height;
 zoom=z;E.pages.forEach(layout);
 const q=P.el.getBoundingClientRect();view.scrollLeft+=q.left+fx*q.width-cx;view.scrollTop+=q.top+fy*q.height-cy;
 scheduleRefresh();updatePill()}
view.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZoom(zoom*Math.exp(-e.deltaY*.01),e.clientX,e.clientY)}},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('gesturechange',e=>e.preventDefault());
window.addEventListener('resize',()=>{if(E.doc){sizeOv();reqPaint();fsUpdate(false)}});

/* ----- उँगलियों के इशारे: दो उँगली से ज़ूम और खिसकाना, टैप से पीछे / आगे ----- */
const fingers=e=>[...e.touches].filter(t=>t.touchType!=='stylus');
const tdist=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
function cancelCur(){const c=cur;if(!c)return;cur=null;clearTimeout(c.hold);if(c.lz){c.lz.end=performance.now()}else if(c.tool==='erase'){c.P.strokes=c.before;redraw(c.P)}else if(c.s&&c.s.t==='pen'&&!c.line)redraw(c.P);reqPaint()}
view.addEventListener('touchstart',e=>{
 if([...e.changedTouches].some(t=>t.touchType==='stylus')){if(e.cancelable)e.preventDefault();return}
 if(penDown||performance.now()-lastPenUp<280){if(e.cancelable)e.preventDefault();return}
 const f=fingers(e);
 if(f.length===1&&S.finger&&e.target.closest('.pg')){if(e.cancelable)e.preventDefault();return}
 if(f.length===2){
  if(!e.cancelable){gest=null;return}
  e.preventDefault();if(cur&&cur.touch)cancelCur();
  const br=box.getBoundingClientRect(),cx=(f[0].clientX+f[1].clientX)/2,cy=(f[0].clientY+f[1].clientY)/2;
  gest={d:tdist(f[0],f[1]),cx,cy,s:1,dx:0,dy:0,t:performance.now(),moved:false};box.style.transformOrigin=(cx-br.left)+'px '+(cy-br.top)+'px';
 }else if(f.length===3){if(e.cancelable)e.preventDefault();if(gest){gest=null;box.style.transform=''}tri={t:performance.now(),x:f[0].clientX,y:f[0].clientY,moved:false}}
},{passive:false});
view.addEventListener('touchmove',e=>{
 if(penDown&&e.cancelable){e.preventDefault();return}
 const f=fingers(e);
 if(tri&&f[0]&&Math.hypot(f[0].clientX-tri.x,f[0].clientY-tri.y)>14)tri.moved=true;
 if(!gest||f.length!==2)return;if(e.cancelable)e.preventDefault();
 const g=gest,d=tdist(f[0],f[1]);g.dx=(f[0].clientX+f[1].clientX)/2-g.cx;g.dy=(f[0].clientY+f[1].clientY)/2-g.cy;
 if(Math.abs(d-g.d)>12||Math.hypot(g.dx,g.dy)>12)g.moved=true;
 if(g.moved){g.s=clamp(d/g.d,.25/zoom,6/zoom);box.style.transform='translate('+g.dx+'px,'+g.dy+'px) scale('+g.s+')'}
},{passive:false});
function touchEnd(e){
 if(tri&&e.touches.length===0){if(!tri.moved&&performance.now()-tri.t<400)redo();tri=null}
 if(!gest||fingers(e).length>=2)return;
 const g=gest;gest=null;box.style.transform='';
 if(g.moved){setZoom(zoom*g.s,g.cx,g.cy);view.scrollLeft-=g.dx;view.scrollTop-=g.dy}
 else if(performance.now()-g.t<320)undo()}
view.addEventListener('touchend',touchEnd);view.addEventListener('touchcancel',touchEnd);

/* ----- छोटी तस्वीर ----- */
async function makeThumb(pdfPage,P,strokes){
 const sc=300/P.w,c=document.createElement('canvas');c.width=Math.round(P.w*sc);c.height=Math.round(P.h*sc);const ctx=c.getContext('2d');
 ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
 if(pdfPage)await pdfPage.render({canvasContext:ctx,viewport:pdfPage.getViewport({scale:sc})}).promise;else drawPaper(ctx,P,sc);
 inkOnto(ctx,c,strokes,sc);const u=c.toDataURL('image/jpeg',.74);c.width=c.height=0;return u}
function inkOnto(ctx,c,strokes,sc){
 const hs=strokes.filter(s=>s.t==='hl');
 if(hs.length){const h=document.createElement('canvas');h.width=c.width;h.height=c.height;const hc=h.getContext('2d');hs.forEach(s=>drawStroke(hc,s,sc));
  ctx.save();ctx.globalAlpha=HL_A;ctx.globalCompositeOperation='multiply';ctx.drawImage(h,0,0);ctx.restore();h.width=h.height=0}
 strokes.filter(s=>s.t==='pen').forEach(s=>drawStroke(ctx,s,sc))}

/* ----- लिखी हुई PDF बनाना ----- */
const hex2rgb=h=>{h=h.replace('#','');return[parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255]};
async function exportVector(){
 const {PDFDocument,rgb,LineCapStyle,BlendMode}=PDFLib,note=E.doc.kind==='note';
 const pd=note?await PDFDocument.create():await PDFDocument.load(E.bytes,{ignoreEncryption:true});const pp=note?[]:pd.getPages();
 for(let i=0;i<E.pages.length;i++){
  const P=E.pages[i];let page,cv;
  if(note){page=pd.addPage([P.w,P.h]);cv=(x,y)=>({x,y:P.h-y});const m=paperMarks(P);page.drawRectangle({x:0,y:0,width:P.w,height:P.h,color:rgb(1,.996,.98)});
   m.Ln.forEach(l=>page.drawLine({start:cv(l[0],l[1]),end:cv(l[2],l[3]),thickness:.7,color:rgb(.8,.84,.9)}));m.D.forEach(d=>page.drawCircle({x:d[0],y:P.h-d[1],size:.9,color:rgb(.73,.76,.83)}))}
  else{if(!P.strokes.length||!pp[i])continue;page=pp[i];const vp=(await getPage(P)).getViewport({scale:1});cv=(x,y)=>{const r=vp.convertToPdfPoint(x,y);return{x:r[0],y:r[1]}}}
  for(const s of P.strokes){if(s.t!=='hl')continue;
   let d='';s.p.forEach((q,j)=>{const c=cv(q[0],q[1]);d+=(j?'L':'M')+c.x.toFixed(2)+' '+(-c.y).toFixed(2)+' '});
   page.drawSvgPath(d,{x:0,y:0,borderColor:rgb(...hex2rgb(s.c)),borderWidth:s.w,borderOpacity:HL_A,borderLineCap:LineCapStyle.Round,blendMode:BlendMode.Multiply})}
  for(const s of P.strokes){if(s.t!=='pen')continue;const col=rgb(...hex2rgb(s.c)),p=s.p;
   if(p.length===1){const c=cv(p[0][0],p[0][1]);page.drawCircle({x:c.x,y:c.y,size:s.w*wf(p[0][2])/2,color:col});continue}
   if(isUni(s)){let d='';p.forEach((q,j)=>{const c=cv(q[0],q[1]);d+=(j?'L':'M')+c.x.toFixed(2)+' '+(-c.y).toFixed(2)+' '});
    page.drawSvgPath(d,{x:0,y:0,borderColor:col,borderWidth:s.w*wf(p[0][2]),borderLineCap:LineCapStyle.Round});continue}
   for(let j=1;j<p.length;j++)page.drawLine({start:cv(p[j-1][0],p[j-1][1]),end:cv(p[j][0],p[j][1]),thickness:s.w*wf((p[j-1][2]+p[j][2])/2),color:col,lineCap:LineCapStyle.Round})}
  if(i%4===0){toast('PDF बन रही है… '+(i+1)+' / '+E.pages.length,60000);await sleep(0)}}
 return new Blob([await pd.save()],{type:'application/pdf'})}
async function exportRaster(){
 const {jsPDF}=window.jspdf;let out=null;
 for(let i=0;i<E.pages.length;i++){const P=E.pages[i];toast('PDF बन रही है… '+(i+1)+' / '+E.pages.length,60000);
  const sc=Math.min(2,Math.sqrt(7e6/(P.w*P.h))),c=document.createElement('canvas');c.width=Math.round(P.w*sc);c.height=Math.round(P.h*sc);const ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);await (await getPage(P)).render({canvasContext:ctx,viewport:P.page.getViewport({scale:sc})}).promise;
  inkOnto(ctx,c,P.strokes,sc);const o=P.w>P.h?'l':'p';
  if(!out)out=new jsPDF({orientation:o,unit:'pt',format:[P.w,P.h],compress:true});else out.addPage([P.w,P.h],o);
  out.addImage(c.toDataURL('image/jpeg',.88),'JPEG',0,0,P.w,P.h,undefined,'FAST');c.width=c.height=0;await sleep(0)}
 return out.output('blob')}
async function exportPdf(){
 if(!E.doc||busy)return;busy=true;toast('PDF बन रही है…',60000);
 try{try{lastBlob=await exportVector()}catch(e){console.warn(e);if(E.doc.kind==='note')throw e;lastBlob=await exportRaster()}
  toast('');const name=E.doc.name+' - नोट्स.pdf';
  if(await dialog({title:'PDF तैयार है',text:'"'+name+'" को फ़ाइलों में सेव कीजिए या किसी को भेजिए।',ok:'सेव / शेयर'})){
   const f=new File([lastBlob],name,{type:'application/pdf'});
   if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name})}catch(e){if(e.name!=='AbortError')download(lastBlob,name)}}else download(lastBlob,name)}}
 catch(e){console.error(e);toast('PDF नहीं बन पाई, दोबारा कोशिश कीजिए',3000)}
 finally{busy=false}}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},8000)}

document.addEventListener('selectstart',e=>{if(e.target.tagName!=='INPUT')e.preventDefault()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
renderBar();loadLib().catch(e=>{console.error(e);toast('इस ब्राउज़र में फ़ाइलें सुरक्षित नहीं हो पा रहीं। निजी (Private) टैब हो तो सामान्य टैब में खोलिए।',8000)});
</script>
